    // שנופל על אותו מקום (mouseup) צריך להתעלם ממנו, בדיוק כמו uvMeterJustDragged למעלה.
    let commentaryDrawerJustDragged = false;

    // גרירת המגירה: pointerdown נרשם על כל "משטח" (פס האחיזה/אזור הפסוקים/שאר המגירה), אבל
    // pointermove/pointerup נרשמים על document כשגרירה מתחילה - לא setPointerCapture. נוסה במפורש
    // עם setPointerCapture (גם ב-pointerdown וגם נדחה עד אחרי חציית סף התזוזה) ונדחה: אושר בבדיקה
    // (Chromium/Playwright) ששתי הגישות שבורות - capture מיידי ב-pointerdown "חוטף" את ה-click הבא
    // (גם בלי תזוזה בכלל!) לאלמנט שביצע את ה-capture במקום ליעד ההיטסט האמיתי (כך טאפ על פסוק/כפתור
    // בתוך אזור הגרירה הפסיק לעבוד לגמרי), ו-capture דחוי לרגע חציית הסף גרם ל-pointermove הבאים
    // להפסיק להגיע כלל (אושר גם ב-repro מינימלי, לא רק בקוד הזה). גרירה מבוססת document listeners
    // עוקפת את שתי הבעיות: אף פעם לא קוראים ל-setPointerCapture, אז click רגיל תמיד ממשיך לעבוד
    // כרגיל, וה-move/up ממשיכים להגיע ל-document תמיד בלי קשר לאיפה על המסך האצבע/עכבר נמצאים עכשיו.
    function commentaryDrawerDragMoveHandler(e) {
      if (!commentaryDrawerDragging) return;
      const drawer = document.getElementById('commentaryDrawer');
      const delta = e.clientY - commentaryDrawerDragStartY;
      if (Math.abs(delta) > 5 && !commentaryDrawerDragMoved) {
        commentaryDrawerDragMoved = true;
        drawer.style.transition = 'none';
      }
      if (!commentaryDrawerDragMoved) return; // עוד בתוך סף הטאפ - לא מזיזים את המגירה עדיין
      const maxOffset = commentaryDrawerDragMaxOffset;
      commentaryDrawerDragOffset = Math.min(maxOffset, Math.max(0, commentaryDrawerDragStartOffset + delta));
      drawer.style.transform = `translateY(${commentaryDrawerDragOffset}px)`;
    }
    function commentaryDrawerDragEndHandler() {
      if (!commentaryDrawerDragging) return;
      document.removeEventListener('pointermove', commentaryDrawerDragMoveHandler);
      document.removeEventListener('pointerup', commentaryDrawerDragEndHandler);
      document.removeEventListener('pointercancel', commentaryDrawerDragEndHandler);
      commentaryDrawerDragging = false;
      const drawer = document.getElementById('commentaryDrawer');
      drawer.style.transition = '';
      drawer.style.transform = '';
      const maxOffset = commentaryDrawerDragMaxOffset;
      // בלי גרירה משמעותית - לחיצה פשוטה הופכת את המצב (רק אם commentaryDrawerDragAllowTapToggle,
      // כלומר פס האחיזה); עם גרירה - סף נמוך ורגיש, שונה לכל כיוון (התחלה מפתוח דורשת רק
      // DRAWER_CLOSE_DRAG_RATIO כדי לסגור; התחלה מסגור דורשת רק DRAWER_OPEN_DRAG_RATIO כדי לפתוח)
      let shouldClose;
      if (!commentaryDrawerDragMoved) {
        if (!commentaryDrawerDragAllowTapToggle) return; // לחיצה רגילה באזור הפסוקים/המגירה - לא נוגעים במגירה
        shouldClose = !commentaryDrawerClosed;
      } else if (commentaryDrawerDragStartedClosed) {
        shouldClose = commentaryDrawerDragOffset > maxOffset * (1 - DRAWER_OPEN_DRAG_RATIO);
      } else {
        shouldClose = commentaryDrawerDragOffset > maxOffset * DRAWER_CLOSE_DRAG_RATIO;
      }
      if (commentaryDrawerDragMoved && !commentaryDrawerDragAllowTapToggle) {
        commentaryDrawerJustDragged = true;
        setTimeout(() => { commentaryDrawerJustDragged = false; }, 350);
      }
      if (shouldClose && !commentaryDrawerClosed) hideCommentaryDrawer();
      else if (!shouldClose && commentaryDrawerClosed) showCommentaryDrawerBack();
    }
    // נקרא מפס האחיזה (עם toggle-בלחיצה), מאזור הפסוקים, וגם מכל שאר שטח המגירה עצמה כשהיא פתוחה
    // (הכותרת/בורר הפרשן/כפתור הניגון) - בלי toggle-בלחיצה בשני האחרונים, כדי לא לפגוע בלחיצה רגילה
    // על פסוק/כפתור (רק גרירה משמעותית שם נחשבת, ראו commentaryDrawerJustDragged). excludeSelectors
    // מונע התחלת גרירה משטחים שצריכים גלילה טבעית משלהם (תוכן הפירוש, רשימת בחירת הפרשן) או מפס
    // האחיזה עצמו (שכבר מטופל בנפרד - בלי החרגה כאן, ה-pointerdown השני היה דורס את
    // commentaryDrawerDragAllowTapToggle בטעות כשהאירוע ממשיך לבעבע מהאחיזה למגירה).
    function startCommentaryDrawerDrag(e, allowTapToggle) {
      const drawer = document.getElementById('commentaryDrawer');
      if (commentaryDrawerDragging) {
        // גרירה קודמת "תקועה" (pointerup/pointercancel שלה לא הגיע - נדיר אך קורה ב-iOS כשמחווה
        // מערכתית חוטפת את המגע) הייתה נועלת את הגרירה לצמיתות בלי זה - כל נגיעה חדשה הייתה
        // מדולגת בשקט (commentaryDrawerDragging נשאר true), מרגיש כאילו "אין תזוזה בכלל".
        // נגיעה חדשה מנקה את הישנה ומתחילה גרירה נקייה, בלי להפעיל לוגיקת סגירה/פתיחה על הישנה.
        document.removeEventListener('pointermove', commentaryDrawerDragMoveHandler);
        document.removeEventListener('pointerup', commentaryDrawerDragEndHandler);
        document.removeEventListener('pointercancel', commentaryDrawerDragEndHandler);
        drawer.style.transition = '';
        drawer.style.transform = '';
      }
      commentaryDrawerDragging = true;
      commentaryDrawerDragMoved = false;
      commentaryDrawerDragAllowTapToggle = allowTapToggle;
      commentaryDrawerDragStartedClosed = commentaryDrawerClosed;
      commentaryDrawerDragStartY = e.clientY;
      commentaryDrawerDragMaxOffset = drawer.getBoundingClientRect().height - getDrawerPeekPx(drawer);
      commentaryDrawerDragStartOffset = commentaryDrawerClosed ? commentaryDrawerDragMaxOffset : 0;
      commentaryDrawerDragOffset = commentaryDrawerDragStartOffset;
      document.addEventListener('pointermove', commentaryDrawerDragMoveHandler);
      document.addEventListener('pointerup', commentaryDrawerDragEndHandler);
      document.addEventListener('pointercancel', commentaryDrawerDragEndHandler);
    }
    function setupDrawerDragSurface(el, allowTapToggle, excludeSelectors) {
      el.addEventListener('pointerdown', (e) => {
        if (excludeSelectors && excludeSelectors.some((sel) => e.target.closest(sel))) return;
        startCommentaryDrawerDrag(e, allowTapToggle);
      });
    }
    setupDrawerDragSurface(document.getElementById('commentaryDrawerHandle'), true);
    setupDrawerDragSurface(document.getElementById('userViewVerses'), false);
    // כל שאר שטח המגירה (כותרת, בורר הפרשן, כפתור הניגון, רקע) - לא רק פס האחיזה הדק; זו הייתה
    // הסיבה לכך שבאייפון גרירה "מהמגירה עצמה" הרגישה לא אמינה (לפעמים האצבע פשוט לא נחתה בדיוק
    // על 44x6 הפיקסלים של האחיזה). #commentaryDrawerBody ו-#commentaryDrawerCommentatorList מוחרגים
    // כי הם צריכים גלילה טבעית משלהם (טקסט פירוש ארוך / רשימת פרשנים ארוכה).
    const DRAWER_SCROLLABLE_SELECTORS = ['#commentaryDrawerHandle', '#commentaryDrawerBody', '#commentaryDrawerCommentatorList'];
    setupDrawerDragSurface(document.getElementById('commentaryDrawer'), false, DRAWER_SCROLLABLE_SELECTORS);
    // #commentaryDrawer הוא אח של #userView (ראו למעלה) - חסימת ה-touchmove הקיימת על #userView
    // (שמונעת מ-iOS "לגלוש" למחוות גלילה/מתיחה טבעית של הדף) לעולם לא חלה על המגירה, כי זה עץ DOM
    // נפרד לגמרי. בלי זה, גרירה שמתחילה על שטח המגירה עצמה (לא הידית, לא הפירוש/רשימת הפרשנים) הייתה
    // לפעמים "נבלעת" ע"י מחוות rubber-band טבעית של iOS במקום ע"י הגרירה שלנו (JS).
    document.getElementById('commentaryDrawer').addEventListener('touchmove', (e) => {
      if (DRAWER_SCROLLABLE_SELECTORS.some((sel) => e.target.closest(sel))) return;
      e.preventDefault();
    }, { passive: false });

    document.getElementById('commentaryDrawerCommentatorBtn').addEventListener('click', async (e) => {
      e.stopPropagation();
      // גרירה משמעותית של המגירה שהתחילה על הכפתור הזה (ראו setupDrawerDragSurface למעלה) - לא גם toggle לרשימה
      if (commentaryDrawerJustDragged) { commentaryDrawerJustDragged = false; return; }
      const listEl = document.getElementById('commentaryDrawerCommentatorList');
      if (listEl.classList.contains('open')) { closeCommentaryList(); return; }
      const v = commentaryDrawerVerse;
      if (!v) return;
      listEl.classList.add('open');
      const key = `${v.book}|${v.chapterNum}`;
      const cached = resolvedCommentatorsChapters.get(key);
      if (cached) {
        renderCommentaryOptions(cached[v.verseNum] || []);
        return;
      }
      listEl.innerHTML = '<div class="commentary-option-loading">טוען...</div>';
      const data = await fetchCommentatorsChapter(v);
      if (v !== commentaryDrawerVerse) return; // המשתמש כבר עבר לפסוק אחר בזמן ההמתנה לתשובה
      renderCommentaryOptions(data[v.verseNum] || []);
    });
    function renderCommentaryOptions(list) {
      document.getElementById('commentaryDrawerCommentatorList').innerHTML = list.map(c =>
        `<button class="commentary-option${c.prefix === commentaryDrawerCommentator ? ' active' : ''}" data-commentator="${escHtml(c.prefix)}">${escHtml(c.label)}</button>`
      ).join('');
    }
    // הרשימה נבנית מחדש בכל פתיחה - מאזין יחיד ב-delegation
    document.getElementById('commentaryDrawerCommentatorList').addEventListener('click', (e) => {
      const opt = e.target.closest('.commentary-option');
      if (!opt) return;
      e.stopPropagation();
      closeCommentaryList();
      const prefix = opt.dataset.commentator;
      if (prefix === commentaryDrawerCommentator) return;
      commentaryDrawerCommentator = prefix;
      sessionStorage.setItem('commentaryCommentator', prefix);
      renderCommentaryDrawer();
      const v = commentaryDrawerVerse;
      if (v) loadCommentaryForDrawer(v, prefix);
    });
    // סגירת רשימת הפרשנים בלחיצה מחוץ לה
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#commentaryDrawerSelector')) closeCommentaryList();
    });

    // הפסוק הנוכחי המוצג בתוך המגירה - לחיצה עליו רק מחליפה play/pause (בלי seek, הוא כבר הנוכחי)
    document.getElementById('commentaryDrawerRef').addEventListener('click', () => {
      const audio = document.getElementById('srtPlayer');
      if (audio.paused) audio.play().catch(() => {}); else audio.pause();
    });
    document.getElementById('uvBigPlayBtn').addEventListener('click', () => {
      // כנ"ל - גרירה משמעותית של המגירה מאזור הפסוקים (ראו commentaryDrawerJustDragged למעלה) לא אמורה גם לטגל ניגון
      if (commentaryDrawerJustDragged) { commentaryDrawerJustDragged = false; return; }
      const audio = document.getElementById('srtPlayer');
      // שני הכפתורים האלה מוחרגים מה"העירו" הגלובלי (ראו שם) - play() כאן הוא כבר play() אמיתי בתוך
      // מחוות משתמש, אז מותר להחיל מיד אחריו מיקום שמור ממתין (pendingRestoreTime), אם יש.
      if (audio.paused) { audio.play().catch(() => {}); uvApplyPendingRestore(); } else audio.pause();
    });
    // מאז שכל שטח המגירה נהיה משטח גרירה (ראו setupDrawerDragSurface(commentaryDrawer,...) למעלה) -
    // גרירה משמעותית שהתחילה על הכפתור הזה בדיוק צריכה להתעלם מה-click שבא אחריה, כמו uvBigPlayBtn.
    document.getElementById('commentaryDrawerPlayBtn').addEventListener('click', () => {
      if (commentaryDrawerJustDragged) { commentaryDrawerJustDragged = false; return; }
      const audio = document.getElementById('srtPlayer');
      if (audio.paused) { audio.play().catch(() => {}); uvApplyPendingRestore(); } else audio.pause();
    });
    uvUpdateDrawerPlayBtn();

    document.getElementById('uvTrack').addEventListener('click', (e) => {
      // ה-click הראשון אחרי שחרור גרירת המד מדולג תמיד - גם אם היעד בפועל (mouseup) נפל מחוץ למד,
      // על שורה אחרת (ראו הערה ליד uvMeterJustDragged למעלה) - אחרת השורה הזאת "נתפסת" בטעות כלחיצה עליה.
      if (uvMeterJustDragged) { uvMeterJustDragged = false; return; }
      // גרירה משמעותית של המגירה מאזור הפסוקים (ראו setupDrawerDragSurface למעלה) - לא גם ניווט/toggle לפסוק שנפל תחת האצבע בשחרור
      if (commentaryDrawerJustDragged) { commentaryDrawerJustDragged = false; return; }
      if (e.target.closest('.uv-meter')) return; // כבר טופל ב-pointerdown/pointermove של גרירת המד - לא גם toggle play/pause
      const row = e.target.closest('.uv-row');
      if (!row) return;
      if (linkerMode) return; // הפסוק הוא לינק אמיתי לספריא - נותנים לניווט הדפדפן הרגיל לקרות
      const idx = parseInt(row.dataset.idx, 10);
      if (Number.isNaN(idx)) return;
      const audio = document.getElementById('srtPlayer');
      if (idx === uvCurrentIdx) {
        // לחיצה על הפסוק הנוכחי (לא פסוק אחר) - רק toggle לניגון, בלי seek
        if (audio.paused) { audio.play().catch(() => {}); uvFlashPlayIcon(row, '▶'); }
        else { audio.pause(); uvFlashPlayIcon(row, '⏸'); }
      } else {
        // לחיצה על פסוק אחר - מנווטת אליו; ממשיכה לנגן רק אם כבר ניגנו קודם, נשארת בהשהיה אם היינו ב-pause
        const wasPlaying = !audio.paused;
        uvSeekTo(idx); // מעדכן את uvCurrentIdx ומדלג ל-currentTime של הפסוק (מסיים ב-pause פנימי משלו)
        if (wasPlaying) {
          audio.play().catch(() => {});
          uvFlashPlayIcon(row, '▶');
        }
      }
    });

    function uvNavigate(direction) {
      if (uvGestureCooldown || uvCurrentIdx === null) return;
      const targetIdx = uvCurrentIdx + direction;
      if (!uvVerses[targetIdx]) return;
      uvGestureCooldown = true;
      uvSeekTo(targetIdx);
      setTimeout(() => { uvGestureCooldown = false; }, 500);
    }

    // גלילה (wheel/swipe) על הפסוקים בוטלה במכוון - הניווט היחיד הוא לחיצה על פסוק (או גרירה/לחיצה על uvSeekBar).
    // ה-preventDefault נשאר כדי שגלילה/מגע בתוך #userView לא "יזלגו" לגלילת הדף שמתחת (הוא position:fixed מלא-מסך).
    const userViewEl = document.getElementById('userView');
    userViewEl.addEventListener('wheel', (e) => {
      if (!userViewActive) return;
      e.preventDefault();
    }, { passive: false });

    userViewEl.addEventListener('touchstart', (e) => {
      if (!userViewActive) return;
      uvTouchStartY = e.touches[0].clientY;
    }, { passive: true });

    userViewEl.addEventListener('touchmove', (e) => {
      if (!userViewActive || uvTouchStartY === null) return;
      e.preventDefault();
    }, { passive: false });

    userViewEl.addEventListener('touchend', (e) => {
      if (!userViewActive || uvTouchStartY === null) return;
      uvTouchStartY = null;
    });

    document.addEventListener('keydown', (e) => {
      if (!userViewActive) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); uvNavigate(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); uvNavigate(-1); }
      else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        const audio = document.getElementById('srtPlayer');
        const row = (uvCurrentIdx !== null && uvCurrentIdx >= 0) ? uvRowEls[uvCurrentIdx] : null;
        if (audio.paused) { audio.play().catch(() => {}); if (row) uvFlashPlayIcon(row, '▶'); }
        else { audio.pause(); if (row) uvFlashPlayIcon(row, '⏸'); }
      }
    });

    function updateUserViewPlayback() {
      if (!userViewActive || noRafLoops) return;
      // תוך כדי גרירת המד הקטן בתוך הפסוק: הגרירה עצמה קובעת audio.currentTime על כל תזוזה, מה
      // שמפעיל timeupdate ומגיע לכאן - אם הגרירה מגיעה קרוב לגבול הפסוק (endSec) idx היה מתחלף,
      // renderUvActive() היה בונה מחדש את כל ה-DOM של השורות, וזה הורס את האלמנט שעליו יש
      // pointer capture באמצע המחווה (הגרירה "נתקעת"). מדלגים לגמרי עד לשחרור (ראו pointerup למעלה).
      if (uvMeterDragging) return;
      const audio = document.getElementById('srtPlayer');
      // כל עוד pendingRestoreTime לא הוחל בפועל (ראו ההערה עליו למעלה) - מציגים לפיו את הפסוק/המד/
      // הכתובית הנכונים, בלי לגעת ב-audio.currentTime האמיתי (עדיין 0) לפני שיש play() אמיתי.
      const t = pendingRestoreTime != null ? pendingRestoreTime : audio.currentTime;
      if (isFinite(audio.duration) && audio.duration > 0 && !uvSeekBarDragging) uvSeekBarRender(t / audio.duration);

      const captionEl = document.getElementById('userViewCaption');
      const seg = srtSegments.find(s => t >= s.start && t < s.end);
      if (seg) {
        if (seg.id !== lastCaptionSegId) { captionEl.textContent = seg.text; lastCaptionSegId = seg.id; }
      } else if (lastCaptionSegId !== null) {
        captionEl.textContent = ''; lastCaptionSegId = null;
      }

      let idx = -1;
      for (let i = 0; i < uvVerses.length; i++) {
        if (uvVerses[i].sec <= t) idx = i; else break;
      }
      if (idx !== uvCurrentIdx) {
        uvCurrentIdx = idx;
        renderUvActive();
        // המגירה מוצגת תמיד - הניגון הרגיל (לא רק ניווט ידני) מעדכן אותה לפסוק הבא בלי לעצור אותו
        if (uvVerses[idx]) updateCommentaryDrawerForVerse(uvVerses[idx]);
      }
      uvUpdateStickyChapter(idx);
    }

    document.getElementById('srtPlayer').addEventListener('timeupdate', updateUserViewPlayback);

    document.getElementById('manualSrtFileParallel').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => { document.getElementById('manualSrtInputParallel').value = e.target.result; };
      reader.readAsText(file, 'utf-8');
    });

    document.getElementById('manualVersesFileParallel').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => { document.getElementById('manualVersesInputParallel').value = e.target.result; };
      reader.readAsText(file, 'utf-8');
    });

    function toggleManualSrtParallel() {
      const area = document.getElementById('manualSrtAreaParallel');
      area.style.display = area.style.display === 'none' ? 'block' : 'none';
    }

    function toggleManualVersesParallel() {
      const area = document.getElementById('manualVersesAreaParallel');
      area.style.display = area.style.display === 'none' ? 'block' : 'none';
    }

    function updateCacheButtons() {
      const hasAll = Object.keys(localStorage).some(k => k.startsWith('verseMapping_') || k.startsWith('srtData_'));
      const hasCurrent = selectedAudioFile && (() => {
        const fk = `${selectedAudioFile.name}_${selectedAudioFile.size}`;
        return localStorage.getItem(`verseMapping_${fk}`) !== null || localStorage.getItem(`srtData_${fk}`) !== null;
      })();
      document.getElementById('btnClearCurrent').style.display = hasCurrent ? '' : 'none';
      document.getElementById('btnClearAll').style.display = hasAll ? '' : 'none';
    }

    function clearCurrentCache() {
      if (!selectedAudioFile) return;
      const fileKey = `${selectedAudioFile.name}_${selectedAudioFile.size}`;
      localStorage.removeItem(`verseMapping_${fileKey}`);
      localStorage.removeItem(`topicsMapping_${fileKey}`);
      localStorage.removeItem(`srtData_${fileKey}`);
      document.getElementById('manualVersesResultParallel').style.display = 'none';
      updateCacheButtons();
    }

    function clearAllCache() {
      Object.keys(localStorage)
        .filter(k => k.startsWith('verseMapping_') || k.startsWith('topicsMapping_') || k.startsWith('srtData_'))
        .forEach(k => localStorage.removeItem(k));
      document.getElementById('manualVersesResultParallel').style.display = 'none';
      updateCacheButtons();
    }

    function loadManualSrtParallel() {
      const srtText = document.getElementById('manualSrtInputParallel').value.trim();
      if (!srtText) { alert('הדבק SRT תחילה'); return; }
      lastData.srt = srtText;
      srtSegments = parseSrt(srtText);
      if (!srtSegments.length) { alert('לא זוהו segments ב-SRT'); return; }
      if (selectedAudioFile) {
        localStorage.setItem(`srtData_${selectedAudioFile.name}_${selectedAudioFile.size}`, srtText);
      }
      document.getElementById('manualSrtAreaParallel').style.display = 'none';
      if (lastVersesData.length) renderParallelVerses({ verses: lastVersesData });
    }

    async function findVersesManualParallel() {
      const text = document.getElementById('manualInputParallel').value.trim();
      if (!text) { alert('הדבק טקסט'); return; }
      const btn = document.getElementById('manualVersesBtnParallel');
      const result = document.getElementById('manualVersesResultParallel');
      const includeTopics = document.getElementById('includeTopicsManual').checked;
      btn.disabled = true; btn.textContent = 'מחפש...';
      result.style.display = 'none';
      try {
        const data = await callFindVerses(text, includeTopics);
        renderVerses(data, result);
      } catch (e) {
        result.textContent = 'שגיאת רשת: ' + e.message;
        result.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'זיהוי פסוקים ברצף';
      }
    }

    function loadManualVersesParallel() {
      const raw = document.getElementById('manualVersesInputParallel').value.trim();
      if (!raw) { alert('הדבק JSON או SRT תחילה'); return; }
      let data;
      if (raw.includes('-->')) {
        const segs = parseSrt(raw);
        if (!segs.length) { alert('לא זוהו ערכים ב-SRT'); return; }
        const verses = segs.map(s => ({
          verse: s.text,
          startTime: s.start != null ? new Date(s.start * 1000).toISOString().substr(11, 8) : undefined,
        }));
        data = { verses, complete: true };
      } else {
        try { data = JSON.parse(raw); } catch (e) { alert('JSON לא תקין: ' + e.message); return; }
        if (Array.isArray(data)) data = { verses: data, complete: true };
        if (!data.verses) { alert('לא נמצא שדה "verses" ב-JSON'); return; }
      }
      const container = document.getElementById('manualVersesResultParallel');
      renderVerses(data, container);
      if (selectedAudioFile && data.verses?.length) {
        const key = `verseMapping_${selectedAudioFile.name}_${selectedAudioFile.size}`;
        localStorage.setItem(key, JSON.stringify(data.verses));
        updateCacheButtons();
      }
      container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      document.getElementById('manualVersesAreaParallel').style.display = 'none';
    }

    async function callFindVerses(text, includeTopics = false) {
      const res = await fetch('/find-verses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, includeTopics }),
      });
      return res.json();
    }

    async function findVersesParallel() {
      const text = lastData.srt || '';
      if (!text) { alert('אין SRT — תמלל קובץ או הדבק SRT תחילה'); return; }
      const btn = document.getElementById('parallelVersesBtn');
      const status = document.getElementById('parallelStatus');
      const includeTopics = document.getElementById('includeTopics').checked;
      btn.disabled = true; btn.textContent = 'מחפש...';
      status.textContent = '';
      try {
        const data = await callFindVerses(text, includeTopics);
        renderParallelVerses(data);
      } catch (e) {
        status.textContent = 'שגיאה: ' + e.message;
      } finally {
        btn.disabled = false; btn.textContent = 'זיהוי פסוקים';
      }
    }

    function renderParallelVerses(versesData) {
      const container = document.getElementById('parallelResult');
      if (versesData.error) {
        container.textContent = 'שגיאה: ' + versesData.error;
        container.style.display = 'block';
        return;
      }
      const { verses = [], complete } = versesData;
      if (verses.length) lastVersesData = verses;
      if (selectedAudioFile && verses.length) {
        localStorage.setItem(`verseMapping_${selectedAudioFile.name}_${selectedAudioFile.size}`, JSON.stringify(verses));
        if (versesData.topics?.length) {
          localStorage.setItem(`topicsMapping_${selectedAudioFile.name}_${selectedAudioFile.size}`, JSON.stringify(versesData.topics));
        }
        updateCacheButtons();
      }

      if (!srtSegments?.length) {
        container.textContent = 'אין נתוני SRT — תמלל קובץ או הדבק SRT תחילה';
        container.style.display = 'block';
        return;
      }

      const bySubtitle = {};
      for (const v of verses) {
        if (!v.missing && v.subtitleNum) bySubtitle[v.subtitleNum] = v;
      }
      const byTime = {};
      for (const v of verses) {
        if (!v.missing && !v.subtitleNum && v.startTime) {
          const sec = srtTimeSec(v.startTime + ',000');
          let closest = null, minDiff = Infinity;
          for (const s of srtSegments) {
            const diff = Math.abs(s.start - sec);
            if (diff < minDiff) { minDiff = diff; closest = s.id; }
          }
          if (closest !== null && minDiff < 5) byTime[closest] = v;
        }
      }

      if (versesData.topics?.length) lastTopicsData = versesData.topics;

      let html = `<div style="margin-bottom:0.75rem;font-size:0.9rem;color:#555;">${complete ? '✅ הרצף שלם' : '⚠️ יש חורים ברצף'}</div>`;

      if (versesData.topics?.length) {
        const hasTopicTimes = versesData.topics.some(t => t.startTime);
        html += `<div class="topics-toc">`;
        html += `<div class="topics-toc-title">📋 תוכן עניינים</div>`;
        for (let i = 0; i < versesData.topics.length; i++) {
          const t = versesData.topics[i];
          const sec = t.startTime ? srtTimeSec(t.startTime + ',000') : null;
          html += `<div class="topic-item"${sec !== null ? ` data-start="${sec}"` : ''}>`;
          html += `<span class="topic-item-title"><span style="color:#86efac;margin-left:0.4rem;">${i + 1}.</span>${escHtml(t.title)}</span>`;
          if (t.startTime) html += `<span class="topic-item-time">${escHtml(t.startTime)}</span>`;
          html += `</div>`;
        }
        if (hasTopicTimes) {
          html += `<div style="margin-top:0.5rem;text-align:left;"><button class="btn-download" style="background:#166534;" onclick="downloadTopicsSrt()">הורד SRT נושאים</button></div>`;
        }
        html += `</div>`;
      }

      const lastSegEnd = srtSegments.length ? srtSegments[srtSegments.length - 1].end : 0;
      const topicMarkers = (versesData.topics || [])
        .map((t, origIdx) => ({ t, origIdx }))
        .filter(({ t }) => t.startTime)
        .map(({ t, origIdx }) => ({ sec: srtTimeSec(t.startTime + ',000'), title: t.title, origIdx }))
        .sort((a, b) => a.sec - b.sec);
      for (let i = 0; i < topicMarkers.length; i++) {
        topicMarkers[i].endSec = i < topicMarkers.length - 1 ? topicMarkers[i + 1].sec : lastSegEnd;
      }
      let tmIdx = 0;

      html += `<div class="parallel-grid">`;
      for (const seg of srtSegments) {
        while (tmIdx < topicMarkers.length && topicMarkers[tmIdx].sec <= seg.start) {
          const tm = topicMarkers[tmIdx];
          html += `<div class="topic-divider" data-start="${tm.sec}" data-end="${tm.endSec}">`;
          html += `<span style="color:#86efac;margin-left:0.4rem;">${tm.origIdx + 1}.</span>${escHtml(tm.title)}`;
          html += `</div>`;
          tmIdx++;
        }
        const verse = bySubtitle[seg.id] ?? byTime[seg.id];
        html += `<div class="parallel-seg" data-start="${seg.start}" data-end="${seg.end}">`;
        html += `<span class="srt-time">${fmtSec(seg.start)}</span> ${escHtml(seg.text)}`;
        html += `</div>`;
        html += `<div class="parallel-verse-cell">`;
        if (verse) {
          const sec = verse.startTime ? srtTimeSec(verse.startTime + ',000') : null;
          html += `<div class="verse-card"${sec !== null ? ` data-start="${sec}"` : ''}>`;
          html += `<div class="verse-header">`;
          html += `<span class="verse-name">${escHtml(verse.verse)}</span>`;
          if (verse.startTime) html += `<span class="verse-time">${escHtml(verse.startTime)}</span>`;
          html += `</div>`;
          if (verse.verseText) html += `<div class="verse-original">${escHtml(verse.verseText)}</div>`;
          html += `</div>`;
        }
        html += `</div>`;
      }
      while (tmIdx < topicMarkers.length) {
        const tm = topicMarkers[tmIdx];
        html += `<div class="topic-divider" data-start="${tm.sec}" data-end="${tm.endSec}">`;
        html += `<span style="color:#86efac;margin-left:0.4rem;">${tm.origIdx + 1}.</span>${escHtml(tm.title)}`;
        html += `</div>`;
        tmIdx++;
      }
      html += `</div>`;

      container.innerHTML = html;
      container.style.display = 'block';

      container.querySelectorAll('.verse-card[data-start], .topic-item[data-start], .topic-divider[data-start]').forEach(el => {
        el.style.cursor = 'pointer';
        el.addEventListener('click', () => {
          const audio = document.getElementById('srtPlayer');
          audio.currentTime = parseFloat(el.dataset.start);
          audio.play();
        });
      });

      if (!rawAudioMode && !suppressCardHighlighting) {
        document.getElementById('srtPlayer').addEventListener('timeupdate', function () {
          const t = this.currentTime;
          container.querySelectorAll('.parallel-seg[data-start]').forEach(div => {
            const s = parseFloat(div.dataset.start), e = parseFloat(div.dataset.end);
            div.classList.toggle('active', t >= s && t < e);
          });
          container.querySelectorAll('.topic-divider[data-start]').forEach(div => {
            const s = parseFloat(div.dataset.start), e = parseFloat(div.dataset.end);
            div.classList.toggle('active', t >= s && t < e);
          });
        });
      }

      document.getElementById('viewToggleFab').disabled = false;
    }

    async function transcribe() {
      const file = document.getElementById('audioFile').files[0] || selectedAudioFile;
      if (!file) { alert('בחר קובץ אודיו'); return; }

      const btn = document.getElementById('btn');
      const status = document.getElementById('status');

      btn.disabled = true;
      status.textContent = 'מעלה קובץ...';

      const form = new FormData();
      form.append('audio', file);

      try {
        const res = await fetch('/transcribe', { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok || data.error) {
          status.textContent = 'שגיאה: ' + JSON.stringify(data.error ?? data);
          return;
        }

        const { jobId } = data;
        status.textContent = 'מתמלל...';
        await pollStatus(jobId);
      } catch (e) {
        status.textContent = 'שגיאת רשת: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function pollStatus(jobId) {
      const status = document.getElementById('status');
      let dots = 0;

      while (true) {
        await new Promise(r => setTimeout(r, 3000));
        dots = (dots + 1) % 4;
        status.textContent = 'מתמלל' + '.'.repeat(dots + 1);

        try {
          const res = await fetch('/status/' + jobId);
          const data = await res.json();

          if (!res.ok || data.error) {
            status.textContent = 'שגיאה: ' + JSON.stringify(data.error ?? data);
            return;
          }

          if (data.status === 'COMPLETED') {
            lastData = data;
            if (data.srt) {
              srtSegments = parseSrt(data.srt);
              if (selectedAudioFile) {
                localStorage.setItem(`srtData_${selectedAudioFile.name}_${selectedAudioFile.size}`, data.srt);
                setupAudioPlayer(selectedAudioFile);
              }
            }
            status.textContent = '';
            return;
          }
        } catch (e) {
          status.textContent = 'שגיאת רשת: ' + e.message;
          return;
        }
      }
    }

    const lectureDebugMatch = location.pathname.match(/^\/lecture\/debug\/([a-zA-Z0-9_-]+(?:\/[a-zA-Z0-9_-]+)*)\/?$/);
    const lectureRouteMatch = location.pathname.match(/^\/lecture\/([a-zA-Z0-9_-]+(?:\/[a-zA-Z0-9_-]+)*)\/?$/);
    if (window.__STATIC_LECTURE__) {
      bootstrapFromStaticLecture(window.__STATIC_LECTURE__);
    } else if (lectureDebugMatch) {
      bootstrapFromLecture(lectureDebugMatch[1], true);
    } else if (lectureRouteMatch) {
      bootstrapFromLecture(lectureRouteMatch[1], false);
    } else {
      initFromCache();
    }
  </script>
</body>
</html>
