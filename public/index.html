<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תמלול IVRIT.AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      background: #f0f2f5;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 960px;
      text-align: center;
    }
    h1 { color: #333; margin-bottom: 1.5rem; }
    input[type="file"] {
      display: block;
      margin: 0 auto 1rem;
      font-size: 1rem;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
    .btn-download {
      background: #16a34a;
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 0.5rem;
      margin-right: 0.5rem;
    }
    #status { margin-top: 1rem; color: #666; font-size: 0.9rem; }
    .divider { border: none; border-top: 1px solid #e2e8f0; margin: 2rem 0; }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 0.75rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      font-family: Arial, sans-serif;
      resize: vertical;
      box-sizing: border-box;
      margin-bottom: 0.75rem;
    }
    .verse-card {
      background: white;
      border: 1px solid #ddd6fe;
      transition: background 0.2s, border-color 0.2s;
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      text-align: right;
    }
    .verse-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }
    .verse-name { font-weight: bold; color: #5b21b6; font-size: 1rem; }
    .verse-time { font-size: 0.85rem; color: #888; font-family: monospace; direction: ltr; }
    .verse-srt { font-size: 0.85rem; color: #555; margin-bottom: 0.25rem; line-height: 1.4; }
    .verse-original { font-size: 0.9rem; color: #333; line-height: 1.5; }
    .verse-label { font-weight: bold; color: #999; margin-left: 0.3rem; }
    .verse-card.active {
      background: #fff3cd;
      border-color: #f5a623;
      border-width: 2px;
    }
    .verse-missing {
      color: #92400e;
      padding: 0.4rem 0.75rem;
      background: #fef3c7;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      text-align: right;
    }
    .verse-status { margin-top: 0.75rem; font-size: 1rem; font-weight: bold; text-align: center; }
    #srtPlayer { width: 100%; margin-bottom: 0; }
    #stickyPlayer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #fff;
      padding: 0.4rem 1rem;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: none;
    }
    #recentAudioSection { margin-top: 0.5rem; }
    #recentAudioSection h4 { font-size: 0.85rem; color: #888; margin: 0 0 0.3rem; text-align: right; }
    .recent-audio-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.35rem 0.6rem; border-radius: 6px; cursor: pointer;
      font-size: 0.88rem; border: 1px solid #e2e8f0; margin-bottom: 3px;
      background: #f8fafc; transition: background 0.15s;
    }
    .recent-audio-item:hover { background: #e0e7ff; }
    .recent-audio-item.active { background: #dbeafe; border-color: #93c5fd; font-weight: bold; }
    .recent-audio-name { direction: ltr; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 75%; }
    .recent-audio-date { font-size: 0.78rem; color: #aaa; flex-shrink: 0; }
    .recent-audio-remove { font-size: 0.75rem; color: #ccc; cursor: pointer; padding: 0 0.2rem; margin-right: 0.3rem; }
    .recent-audio-remove:hover { color: #ef4444; }
    .srt-time {
      font-size: 0.75rem;
      color: #aaa;
      font-family: monospace;
      direction: ltr;
      display: inline-block;
      margin-left: 0.5rem;
    }
    .parallel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      direction: rtl;
    }
    .parallel-seg {
      padding: 0.5rem 0.75rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.9rem;
      line-height: 1.5;
      transition: background 0.15s;
    }
    .parallel-seg.active { background: #fff3cd; border-color: #f5a623; border-width: 2px; }
    .parallel-verse-cell { min-height: 1px; }
    .topics-toc {
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      text-align: right;
    }
    .topics-toc-title {
      font-weight: bold;
      color: #166534;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    .topic-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0.5rem;
      border-radius: 5px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .topic-item:hover { background: #dcfce7; }
    .topic-item-title { color: #1e293b; }
    .topic-item-time { font-family: monospace; font-size: 0.8rem; color: #888; direction: ltr; }
    .topic-divider {
      grid-column: 1 / -1;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-weight: bold;
      color: #166534;
      font-size: 0.9rem;
      margin: 0.25rem 0;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .topic-divider:hover { background: #dcfce7; }
    .topic-divider.active {
      background: #bbf7d0;
      border-color: #16a34a;
      border-width: 2px;
    }
    #userView {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 90;
      background: #f0f2f5;
      flex-direction: column;
      box-sizing: border-box;
      --uv-num-col: 2.8rem;
      --uv-num-slot: 1.2rem;
      --uv-row-spacer-col: 0.5rem;
    }
    #viewToggleFab {
      position: fixed;
      top: 68px;
      right: 16px;
      z-index: 200;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #0891b2;
      color: #fff;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #viewToggleFab:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }
    #viewToggleFab:hover:not(:disabled) { background: #0e7490; }
    #lectureLoader {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: #f0f2f5;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    #lectureLoader .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: lectureSpin 0.8s linear infinite;
    }
    #lectureLoader span { color: #555; font-size: 1rem; }
    @keyframes lectureSpin { to { transform: rotate(360deg); } }
    #captionToggleBtn {
      position: fixed;
      top: 68px;
      right: 68px;
      z-index: 200;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #0891b2;
      color: #fff;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #captionToggleBtn.uv-off { background: #94a3b8; }
    #commitInfoBtn {
      position: fixed;
      top: 68px;
      right: 120px;
      z-index: 200;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #0891b2;
      color: #fff;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #commitInfoOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(0,0,0,0.4);
      align-items: center;
      justify-content: center;
    }
    #commitInfoPopup {
      background: #fff;
      border-radius: 10px;
      padding: 1.25rem;
      max-width: 90vw;
      width: 380px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      direction: rtl;
    }
    #commitInfoPopup h3 { margin: 0 0 0.75rem; font-size: 1.05rem; color: #1e293b; }
    #commitInfoPopup .commit-row { margin: 0.4rem 0; font-size: 0.9rem; color: #333; word-break: break-word; }
    #commitInfoPopup .commit-row b { color: #64748b; }
    #commitInfoPopup button {
      margin-top: 1rem;
      padding: 0.4rem 1rem;
      border: none;
      border-radius: 6px;
      background: #64748b;
      color: #fff;
      cursor: pointer;
    }
    /* position:fixed (שכבה מעל, לא בזרימה של #userView) - כך שפתיחת/סגירת המגירה לא גורמת
       ל-#userView עצמו לעבור reflow של layout; הזזת הפסוקים למעלה כשהמגירה נפתחת (ראו uvPositionTrack,
       uvGetDrawerCoverPx) היא הזזת transform יזומה ב-JS, לא תוצאה של שינוי גובה/מיקום ב-CSS.
       בלי מיסוך - עדיין אפשר ללחוץ על פסוק אחר מתחת למגירה (השטח שמעליה נשאר חופשי לגמרי).
       #commentaryDrawer עצמו הוא אח של #userView, לא בתוכו - כך שגלגול/מגע בתוך המגירה לא
       "דולף" למאזיני ה-wheel/touch שרשומים על #userView. */
    #commentaryDrawer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 500;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-bottom: none;
      height: 40vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      direction: rtl;
      padding: 0.25rem 1.25rem 1.25rem;
      box-sizing: border-box;
      /* מקור אמת יחיד לגובה ה"פס הבולט" (peek) - גם ל-.peek למטה וגם ל-DRAWER_PEEK_PX ב-JS
         (נקרא עם getComputedStyle, ראו getDrawerPeekPx). מכוונן ידנית כאן בלבד - אין צורך לעדכן
         עוד ערך במקביל, זה בדיוק מה שגרם בעבר לקפיצה קטנה בתחילת גרירה כששני המספרים לא היו זהים. */
      --drawer-peek-px: 60px;
    }
    #commentaryDrawer.open { transform: translateY(0); }
    /* "סגורה" בתוך תצוגת המשתמש - לא נעלמת לגמרי כמו כשיוצאים מתצוגת המשתמש (translateY(100%)
       הבסיסי), אלא משאירה פס אחיזה בולט מציץ מעל תחתית המסך, לגרירה/לחיצה כדי לפתוח מחדש. */
    #commentaryDrawer.peek { transform: translateY(calc(100% - var(--drawer-peek-px))); }
    #commentaryDrawerHandle {
      position: relative;
      flex-shrink: 0;
      width: 44px;
      height: 6px;
      margin: 0.5rem auto 0.5rem;
      border-radius: 999px;
      background: #94a3b8;
      cursor: grab;
      touch-action: none;
    }
    /* מגדיל את שטח התפיסה לגרירה/לחיצה בלי לשנות את הגובה החזותי הדק (6px) של הפס עצמו - אותו רעיון כמו .uv-meter::before */
    #commentaryDrawerHandle::before {
      content: '';
      position: absolute;
      top: -14px; bottom: -14px;
      left: -20px; right: -20px;
    }
    #commentaryDrawerHandle:active { cursor: grabbing; }
    /* מוצא מזרימת התוכן הרגילה (position:absolute, יחסית לקופסת #commentaryDrawer עצמה, שהיא
       positioned בזכות ה-fixed) ומוצמד כמעט לקצה העליון - כדי שהכפתור יופיע ויהיה לחיץ גם במצב
       "סגור"/peek של המגירה (ראו #commentaryDrawer.peek ומשתנה --drawer-peek-px), בלי לחכות שהמגירה תיפתח.
       ברוחב מוגבל לתוכן בלבד (בלי left) כדי לא לחפוף לאזור התפיסה המורחב של פס האחיזה (#commentaryDrawerHandle::before). */
    #commentaryDrawerHeader {
      position: absolute;
      top: 0.4rem;
      right: 1.25rem;
      display: flex;
      align-items: center;
      z-index: 2;
      /* בלי זה, גרירה שמתחילה בדיוק כאן (בורר הפרשן) הייתה מתפרשת ע"י iOS כניסיון לגלול/למתוח
         (rubber-band) אזור טבעי - נראה כמו "הגענו לסוף הגלילה" ומתחרה בגרירת המגירה שלנו (JS),
         שממילא ממתינה ל-touch-action:none כדי לקבל בלעדיות על המחווה. */
      touch-action: none;
    }
    /* כמו commentaryDrawerHeader (position:absolute יחסית ל-#commentaryDrawer, גלוי גם ב-peek) אבל
       בצד השני - נראה כמו .uv-big-play-btn (עיגול כתום) ומתנהג כמוהו (toggle play/pause), אבל
       לעולם לא נעלם (בניגוד ל-uv-big-play-btn שמוצג רק לפני הפסוק הראשון/לפני שהניגון התחיל). */
    #commentaryDrawerPlayBtn {
      position: absolute;
      top: 0.4rem;
      left: 1.25rem;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      border: none;
      background: #f5a623;
      color: #fff;
      font-size: 1.05rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
      padding: 0;
      touch-action: none; /* אותה סיבה כמו #commentaryDrawerHeader למעלה */
    }
    #commentaryDrawerSelector { position: relative; }
    .commentary-tab {
      padding: 0.35rem 0.9rem;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #f1f5f9;
      color: #334155;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #commentaryDrawerCommentatorList {
      display: none;
      position: absolute;
      bottom: 100%;
      right: 0;
      margin-bottom: 0.3rem;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      max-height: 50vh;
      z-index: 10;
      min-width: 110px;
    }
    #commentaryDrawerCommentatorList.open { display: block; }
    .commentary-option-loading { padding: 0.5rem 1rem; font-size: 0.9rem; color: #64748b; }
    .commentary-option {
      display: block;
      width: 100%;
      padding: 0.5rem 1rem;
      border: none;
      background: #fff;
      color: #334155;
      font-size: 0.9rem;
      text-align: right;
      cursor: pointer;
    }
    .commentary-option:hover { background: #f1f5f9; }
    .commentary-option.active { font-weight: 700; color: #1e293b; }
    #commentaryDrawerRef { display: none; }
    /* margin-top מפצה על הוצאת #commentaryDrawerHeader מהזרימה (עכשיו position:absolute, ראו שם) -
       כדי שתחילת התוכן לא תיכנס מתחת לכפתור הבורר הצף בפינה. */
    #commentaryDrawerBody { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin-top: 2.5rem; font-size: 1.05rem; line-height: 1.6; color: #1e293b; }
    #userViewTitle {
      padding-top: 10px;
      flex-shrink: 0;
      height: 3.0rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0px;
      box-sizing: border-box;
      font-size: 1.20rem;
      font-weight: 600;
      color: #334155;
      text-align: center;
    }
    #userViewMiddle {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      max-width: calc(720px + 2.4rem);
      margin: 0 auto;
      /* מפנה בתחתית בגובה פס ה-peek של מגירת הפירוש (ראו #commentaryDrawer.peek), ועוד קצת רווח
         נוסף מעליו - כדי ש-uvSeekBar (שנמתח לכל גובה #userViewMiddle) לא ייכנס מתחת למגירה כשהיא
         סגורה/peek, ושיישאר גם רווח קטן ביניהם. */
      margin-bottom: 62px;
      box-sizing: border-box;
    }
    #uvSeekBar {
      flex: 0 0 2.4rem;
      position: relative;
      touch-action: none;
      cursor: grab;
    }
    #uvSeekBarTrack {
      position: absolute;
      top: 0.4rem; bottom: 0.4rem; left: 50%;
      width: 4px; margin-left: -2px;
      background: rgba(0,0,0,0.12);
      border-radius: 2px;
    }
    #uvSeekBarFill {
      position: absolute;
      top: 0.4rem; left: 50%;
      width: 4px; margin-left: -2px;
      height: 0%;
      background: #0891b2;
      border-radius: 2px;
    }
    #uvSeekBarHandle {
      position: absolute;
      top: 0.4rem; left: 50%;
      width: 18px; height: 18px;
      margin-left: -9px; margin-top: -9px;
      border-radius: 50%;
      background: #0891b2;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    #userViewVerses {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      touch-action: none;
      /* בלי זה, גרירה על טקסט הפסוק (לא רק על פס האחיזה, שאין בו טקסט בכלל) מתחרה ב-iOS Safari
         במחוות בחירת-טקסט המובנית (הדגשה/זכוכית מגדילה/תפריט העתקה) - מרגיש "שבור" לעומת גרירה מהידית. */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* עוטף את uvTrack ומזיז אותו למעלה כשמגירת הפירוש נפתחת (ראו uvPositionTrack) - בלי transition
       משלו, כי הוא מתעדכן כל פריים ישירות לפי המיקום האמיתי (getBoundingClientRect) של המגירה
       המונפשת; אילו הייתה כאן גם transition, ה-uvTrack (שיש לו transition משלו לצעדי פסוקים) היה
       "רודף" אחרי יעד שכל הזמן זז, וזה נראה כמו פיגור אחרי המגירה במקום תזוזה יחד איתה. */
    #uvDrawerShift {
      position: absolute;
      top: 0; left: 0; right: 0;
    }
    #uvTrack {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 0 0.8rem; box-sizing: border-box;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .uv-row {
      position: relative;
      display: flex;
      align-items: flex-start;
      line-height: 1.7;
      font-size: 1.3rem;
      color: #333;
      opacity: 0.35;
      cursor: pointer;
      padding: 0.5rem 0 0.75rem;
      transition: opacity 0.3s ease, color 0.3s ease;
    }
    .uv-row:hover { opacity: 0.55; }
    .uv-row.uv-active {
      opacity: 1;
      color: #1e293b;
      cursor: default;
    }
    .uv-row.uv-active:hover { opacity: 1; }
    .uv-row.uv-hidden-hist { opacity: 0; pointer-events: none; }
    .uv-num-badge {
      flex: 0 0 var(--uv-num-col);
      height: calc(1.3rem * 1.7);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.1rem;
      white-space: nowrap;
    }
    .uv-row-text {
      flex: 1 1 0%;
      min-width: 0;
      text-align: right;
    }
    .uv-row-spacer {
      flex: 0 0 var(--uv-row-spacer-col);
    }
    .uv-verse-num {
      flex: 0 0 var(--uv-num-slot);
      text-align: right;
      font-size: 1.3rem;
      color: #999;
      pointer-events: none;
      user-select: none;
    }
    .uv-row.uv-active .uv-verse-num { color: #64748b; font-weight: 600; }
    .uv-chapter-num {
      display: none;
      flex: 0 0 var(--uv-num-slot);
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 600;
      pointer-events: none;
      user-select: none;
    }
    #userView.uv-sequence-mode .uv-row {
      font-size: 1.20rem;
      line-height: 1.5;
      padding: 0.35rem 0 0.5rem;
    }
    #userView.uv-sequence-mode .uv-num-badge {
      height: calc(1.05rem * 1.5);
    }
    #userView.uv-linker-mode .uv-row {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    #userView.uv-linker-mode .uv-row.uv-active {
      cursor: pointer;
    }
    .uv-meter {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 3px;
      border-radius: 2px;
      background: rgba(0,0,0,0.08);
      display: none;
      touch-action: none;
    }
    /* מגדיל את שטח התפיסה לגרירה/לחיצה בלי לשנות את הגובה החזותי הדק (3px) של המד עצמו -
       פסאודו-אלמנט שקוף שתופס גם קצת מעל ומתחת, כי אצבע/עכבר מתקשה לפגוע בול ב-3px. */
    .uv-meter::before {
      content: '';
      position: absolute;
      top: -8px; bottom: -8px;
      left: 0; right: 0;
    }
    .uv-meter.uv-meter-top {
      bottom: auto;
      top: 0;
    }
    /* אייקון play/pause שמבזיק ברקע הפסוק הפעיל בלחיצה ונעלם - z-index שלילי כדי לשבת מאחורי
       הטקסט (הרגיל, בזרימה) בלי position/z-index נוספים על שאר תוכן השורה. */
    .uv-flash-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: rgba(0,0,0,0.16);
      opacity: 0;
      pointer-events: none;
      user-select: none;
      z-index: -1;
      transition: opacity 0.25s ease;
    }
    .uv-flash-icon.uv-flash-visible { opacity: 1; }
    .uv-play-state-icon {
      position: absolute;
      right: 0;
      bottom: 7px;
      font-size: 0.7rem;
      line-height: 1;
      color: #f5a623;
      display: none !important;
      pointer-events: none;
      user-select: none;
    }
    .uv-big-play-btn {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translateX(-50%);
      width: 4rem; height: 4rem;
      border-radius: 50%;
      border: none;
      background: #f5a623;
      color: #fff;
      font-size: 1.6rem;
      line-height: 1;
      align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 2;
      padding: 0;
    }
    /* הוסתר במכוון (CSS בלבד) - הפליי הגדול במרכז המסך נשאר קיים ב-DOM/JS (uvShowBigPlayBtn עדיין
       מוסיף/מסיר את uv-visible), אבל הוחלף חזותית ע"י #commentaryDrawerPlayBtn שבמגירה. */
    .uv-big-play-btn.uv-visible { display: none; }
    .uv-meter-fill {
      width: 100%;
      height: 100%;
      border-radius: 2px;
      background: #f5a623;
      transform-origin: right center;
      transform: scaleX(0);
      will-change: transform;
    }
    /* כדור אחיזה גלוי במיקום הניגון הנוכחי בתוך המד הקטן - עוקב אחרי אותו progress כמו .uv-meter-fill,
       ממורכז אנכית וממוקם ב-JS (updateUvMeter) לפי left באחוזים, לא CSS transform כמו ה-fill. */
    .uv-meter-handle {
      position: absolute;
      top: 50%; left: 0%;
      width: 10px; height: 10px;
      margin-left: -5px; margin-top: -5px;
      border-radius: 50%;
      background: #f5a623;
      box-shadow: 0 0 0 2px #fff;
    }
    #userViewCaption {
      flex-shrink: 0; height: 5.5rem; overflow-y: auto;
      background: #111827; color: #fff; font-size: 1.3rem; line-height: 1.5;
      text-align: center; padding: 0.5rem 1.5rem; box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
  <div id="lectureLoader"><div class="spinner"></div><span>טוען את השיעור...</span></div>
  <div id="stickyPlayer"><audio id="srtPlayer" controls style="width:100%;"></audio></div>
  <button id="viewToggleFab" disabled onclick="toggleUserView()" title="החלף תצוגה">📖</button>
  <button id="captionToggleBtn" class="uv-off" onclick="toggleCaptions()" title="הצג כתוביות">💬</button>
  <button id="commitInfoBtn" onclick="showCommitInfo()" title="מידע קומיט">🔖</button>
  <div id="commitInfoOverlay" onclick="if (event.target === this) hideCommitInfo()">
    <div id="commitInfoPopup">
      <h3>מידע קומיט</h3>
      <div id="commitInfoBody">טוען...</div>
      <button onclick="hideCommitInfo()">סגור</button>
    </div>
  </div>
  <div class="card">
    <h1>תמלול עברית</h1>
    <input type="file" id="audioFile" accept="audio/*,video/*,.mp3,.m4a,.wav,.aac,.ogg,.flac,.opus,.wma,.mp4,.mov,.avi,.mkv,.webm">
    <div id="recentAudioSection" style="display:none;">
      <div id="recentAudioList"></div>
    </div>
    <button class="btn-primary" id="btn" onclick="transcribe()">תמלל</button>
    <div id="status"></div>

    <div style="margin-top:1rem;margin-bottom:1rem;text-align:right;display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;">
      <button class="btn-download" id="parallelVersesBtn" onclick="findVersesParallel()" style="background:#7c3aed;">זיהוי פסוקים</button>
      <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#555;cursor:pointer;user-select:none;">
        <input type="checkbox" id="includeTopics" style="cursor:pointer;"> כלול נושאים
      </label>
      <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#555;user-select:none;">
        פסוקים קודמים בתצוגת משתמש:
        <select id="prevVersesSelect" onchange="setPrevVersesCount(this.value)" style="padding:0.2rem 0.4rem;border-radius:4px;border:1px solid #ccc;cursor:pointer;">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </label>
      <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#555;cursor:pointer;user-select:none;">
        <input type="checkbox" id="showMeterCheckbox" checked onchange="setShowMeter(this.checked)" style="cursor:pointer;"> הצג מד התקדמות בתצוגת משתמש
      </label>
      <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#555;cursor:pointer;user-select:none;">
        <input type="checkbox" id="pauseBeforeVerseCheckbox" onchange="setPauseBeforeVerse(this.checked)" style="cursor:pointer;"> עצור מעט אחרי שכל פסוק מתחיל (תצוגת משתמש)
      </label>
      <span id="parallelStatus" style="font-size:0.85rem;color:#888;"></span>
    </div>
    <div id="parallelResult"></div>

    <div style="margin-top:0.75rem;text-align:right;">
      <button class="btn-download" style="background:#64748b;" onclick="toggleManualSrtParallel()">הדבק SRT ידנית</button>
      <div id="manualSrtAreaParallel" style="display:none;margin-top:0.5rem;">
        <div style="margin-bottom:0.4rem;text-align:left;">
          <input type="file" id="manualSrtFileParallel" accept=".srt,text/plain" style="font-size:0.85rem;">
        </div>
        <textarea id="manualSrtInputParallel" placeholder="הדבק כאן SRT..." style="width:100%;min-height:120px;padding:0.5rem;border:1px solid #e2e8f0;border-radius:6px;font-size:0.85rem;font-family:monospace;direction:ltr;resize:vertical;box-sizing:border-box;"></textarea>
        <button class="btn-primary" style="margin-top:0.4rem;" onclick="loadManualSrtParallel()">טען SRT</button>
      </div>
    </div>

    <hr class="divider">
    <h2 style="color:#333;margin-bottom:1rem;">זיהוי פסוקים ברצף</h2>
    <textarea id="manualInputParallel" placeholder="הדבק כאן טקסט או SRT לזיהוי פסוקים ברצף..."></textarea>
    <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
      <button class="btn-primary" id="manualVersesBtnParallel" onclick="findVersesManualParallel()" style="background:#7c3aed;">זיהוי פסוקים ברצף</button>
      <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#555;cursor:pointer;user-select:none;">
        <input type="checkbox" id="includeTopicsManual" style="cursor:pointer;"> כלול נושאים
      </label>
    </div>
    <div id="manualVersesResultParallel" style="display:none;margin-top:1rem;"></div>

    <div style="margin-top:0.75rem;text-align:right;display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:flex-end;">
      <button class="btn-download" style="background:#64748b;" onclick="toggleManualVersesParallel()">הדבק מיפוי פסוקים ידנית</button>
      <button id="btnClearCurrent" class="btn-download" style="background:#dc2626;display:none;" onclick="clearCurrentCache()">נקה קאש לקובץ זה</button>
      <button id="btnClearAll" class="btn-download" style="background:#7f1d1d;display:none;" onclick="clearAllCache()">נקה כל הקאש</button>
      <div id="manualVersesAreaParallel" style="display:none;margin-top:0.5rem;width:100%;">
        <div style="margin-bottom:0.4rem;text-align:left;">
          <input type="file" id="manualVersesFileParallel" accept=".json,.srt,text/plain" style="font-size:0.85rem;">
        </div>
        <textarea id="manualVersesInputParallel" placeholder='הדבק כאן JSON של מיפוי פסוקים...' style="width:100%;min-height:120px;padding:0.5rem;border:1px solid #e2e8f0;border-radius:6px;font-size:0.85rem;font-family:monospace;direction:ltr;resize:vertical;box-sizing:border-box;"></textarea>
        <button class="btn-primary" style="margin-top:0.4rem;" onclick="loadManualVersesParallel()">טען מיפוי</button>
      </div>
    </div>
  </div>

  <div id="userView">
    <div id="userViewTitle"></div>
    <div id="userViewMiddle">
      <div id="uvSeekBar">
        <div id="uvSeekBarTrack"></div>
        <div id="uvSeekBarFill"></div>
        <div id="uvSeekBarHandle"></div>
      </div>
      <div id="userViewVerses">
        <button type="button" class="uv-big-play-btn" id="uvBigPlayBtn" aria-label="נגן/השהה"></button>
        <div id="uvDrawerShift">
          <div id="uvTrack"></div>
        </div>
      </div>
    </div>
    <div id="userViewCaption" style="display:none;"></div>
  </div>

  <div id="commentaryDrawer">
    <div id="commentaryDrawerHandle"></div>
    <button id="commentaryDrawerPlayBtn" type="button" aria-label="נגן/השהה"></button>
    <div id="commentaryDrawerHeader">
      <div id="commentaryDrawerSelector">
        <button id="commentaryDrawerCommentatorBtn" class="commentary-tab" type="button"></button>
        <div id="commentaryDrawerCommentatorList"></div>
      </div>
    </div>
    <div id="commentaryDrawerRef"></div>
    <div id="commentaryDrawerBody"></div>
  </div>

  <script>
    let lastData = {};
    let lastVersesData = [];
    let lastTopicsData = [];
    let selectedAudioFile = null;
    let srtSegments = [];
    let userViewActive = false;
    let lastCaptionSegId = null;
    let uvVerses = [];
    let uvCurrentIdx = null; // null = not yet rendered; forces an initial render even if idx computes to -1
    // מוצהר כאן (מוקדם) ולא רק ליד מאזיני ה-play/pause שמשתמשים בו - applyMeterVisibility (רחוק למטה)
    // כבר קורא לו בקריאה המיידית הראשונה שלו, לפני שהגענו לשורה שמאזינה לאירועים בפועל.
    let audioEverPlayed = false;
    // true כשהניגון נפתח עם מיקום שמור (לא 0) משיעור קודם - במצב הזה כפתור ה-PLAY הגדול
    // ("תלחץ כאן כדי להתחיל") לא אמור להופיע רק בגלל ש-audioEverPlayed=false, כי אנחנו כבר
    // באמצע השיעור, לא בהתחלה. עדיין מוצג במצב beforeFirstVerse (למשל גרירת הסימון חזרה ל-0).
    let positionRestoredNonZero = false;
    // זמן (שניות) לשחזור בפועל ב-audio.currentTime - נשמר ל"מאוחר יותר" ולא מוחל מיד ב-loadedmetadata
    // (כמו שהיה קודם): seek לפני שיש play() אמיתי אחד לפחות תוך כדי מחוות משתמש תוקע לצמיתות את
    // יכולת ה-seek ב-iOS, גם אחרי שמנגנים מאוחר יותר (אותה בעיה בדיוק שתועדה עבור uvSeekTo/ההעירו
    // הגלובלי למטה - ה-loadedmetadata של הטעינה האוטומטית הוא seek "לפני play" קלאסי). מוחל בפועל
    // רק בתוך אחד מהמקומות שכבר מבצעים play() אמיתי בתוך מחוות משתמש (ההעירו הגלובלי, כפתורי ה-play).
    // עד אז, updateUserViewPlayback מציג את הפסוק הנכון לפי הערך הזה בלי לגעת ב-audio.currentTime בפועל.
    let pendingRestoreTime = null;
    // מחיל בפועל את pendingRestoreTime (אם יש) - לקרוא רק ממקום שכבר ביצע play() אמיתי בתוך מחוות
    // משתמש קודם (ראו ההערה על pendingRestoreTime למעלה בשביל הסיבה).
    function uvApplyPendingRestore() {
      if (pendingRestoreTime == null) return;
      document.getElementById('srtPlayer').currentTime = pendingRestoreTime;
      pendingRestoreTime = null;
      // לא נשענים על אירוע timeupdate/seeked של הדפדפן כדי לעדכן את uvCurrentIdx (updateUserViewPlayback
      // כבר השתמש בערך הזה בעצמו לפני שהוחל, ראו שם) - מעדכנים כאן ישירות, כמו ב-uvSeekTo, ליתר ביטחון.
      if (uvCurrentIdx !== null) updateUserViewPlayback();
    }
    let uvGestureCooldown = false;
    let uvTouchStartY = null;
    let uvRowEls = [];
    let uvRowChapterEls = [];
    let uvRowCenters = [];
    let uvMeterRowIdx = null;
    let uvChapterBadgeIdx = null;
    let uvCurrentChapterNum = null;
    let captionsVisible = false;
    let prevVersesCount = parseInt(localStorage.getItem('uvPrevVersesCount') || '1', 10);
    document.getElementById('prevVersesSelect').value = String(prevVersesCount);
    let showMeter = localStorage.getItem('uvShowMeter') !== 'false';
    document.getElementById('showMeterCheckbox').checked = showMeter;
    let pauseBeforeVerse = localStorage.getItem('uvPauseBeforeVerse') === 'true';
    document.getElementById('pauseBeforeVerseCheckbox').checked = pauseBeforeVerse;
    let uvPauseHandledIdx = null;
    let sequenceMode = new URLSearchParams(location.search).get('rezef') === '1';
    document.getElementById('userView').classList.toggle('uv-sequence-mode', sequenceMode);
    // מצב אופציונלי: כל פסוק הופך ללינק לספריא (נפתח בטאב חדש) במקום seek בנגן - לא נוגע בהתנהגות הרגילה.
    const linkerMode = new URLSearchParams(location.search).get('linker') === '1';
    if (linkerMode) document.getElementById('userView').classList.add('uv-linker-mode');
    const isDebugRoute = location.pathname.includes('/lecture/debug/');
    // מצב אבחון: משבית לגמרי את סנכרון הפסוקים (timeupdate/שחזור מיקום) ומשאיר רק את נגן ה-audio הגולמי,
    // כדי לבודד אם בעיית seek/סנכרון היא בנגן עצמו או בקוד הסנכרון שלנו. אין השפעה כשהפרמטר לא קיים.
    const rawAudioMode = new URLSearchParams(location.search).get('rawaudio') === '1';
    // מצב אבחון: משבית את שלוש לולאות ה-requestAnimationFrame הרציפות של תצוגת המשתמש
    // (uvScrollRaf/uvMeterRaf/uvPauseWatchRaf, שרצות ב-60fps כל עוד התצוגה פעילה) כדי לבדוק
    // אם העומס שלהן על ה-thread הראשי חוסם seek gestures ב-iOS. אין השפעה כשהפרמטר לא קיים.
    const noRafLoops = new URLSearchParams(location.search).get('noraf') === '1';
    // נקבע ל-true ע"י bootstrapFromLecture בנתיב production הרגיל (/lecture/:slug) בלבד -
    // הדגשת verse-card/parallel-seg (כולל scrollIntoView) שרצה תמיד ברקע, גם עם .card
    // מוסתר, אושרה כתורמת לחסימת seek באייפון. false כברירת מחדל, לא פוגע בדף ה-transcribe.
    let suppressCardHighlighting = false;
    applyMeterVisibility();
    updateCacheButtons();

    function applyMeterVisibility() {
      if (uvMeterRowIdx !== null && uvRowEls[uvMeterRowIdx]) {
        const oldRow = uvRowEls[uvMeterRowIdx];
        const old = oldRow.querySelector('.uv-meter');
        if (old) { old.style.display = 'none'; old.classList.remove('uv-meter-top'); }
        const oldIcon = oldRow.querySelector('.uv-play-state-icon');
        if (oldIcon) oldIcon.style.display = 'none';
        oldRow.classList.remove('uv-meter-focus-top');
      }
      uvMeterRowIdx = null;
      const beforeFirstVerse = uvCurrentIdx !== null && uvCurrentIdx < 0;
      // כפתור PLAY גדול מוצג לפני שהניגון בפועל אי-פעם קרה (audioEverPlayed) - כרמז "תלחץ כאן" יחיד -
      // וגם בכל פעם שחוזרים למצב "לפני הפסוק הראשון" (למשל גרירת פס ה-seek בחזרה לזמן 0), כי אז אין
      // שורה "נוכחית" שהפלאש שלה יכול להיצמד אליה. לא אפשר להסתמך רק על uvCurrentIdx===null בשביל
      // הרמז הראשוני: הוא מתמוטט ל-idx=-1 כבר ב-updateUserViewPlayback הראשון שרץ אוטומטית
      // ב-toggleUserView (בלי אינטראקציה בכלל, כי פסוק 0 לרוב מתחיל אחרי זמן 0) - audioEverPlayed
      // הופך ל-true רק ב-'play' event אמיתי ונשאר true לצמיתות עד רענון.
      // חריג: positionRestoredNonZero (נכנסנו לשיעור עם מיקום שמור לא-0) - שם אין טעם ברמז "תלחץ
      // כאן כדי להתחיל" כי כבר באמצע השיעור, לא בהתחלה שלו. עדיין מוצג ב-beforeFirstVerse (למשל
      // גרירת הסימון חזרה ל-0), כי זה מצב אמיתי של "לפני הפסוק הראשון" גם בשיעור עם מיקום משוחזר.
      uvShowBigPlayBtn(beforeFirstVerse || (!audioEverPlayed && !positionRestoredNonZero));
      if (!showMeter || uvCurrentIdx === null) return;
      const targetIdx = beforeFirstVerse ? 0 : uvCurrentIdx;
      const row = uvRowEls[targetIdx];
      if (!row) return;
      const meterEl = row.querySelector('.uv-meter');
      if (!meterEl) return;
      meterEl.classList.toggle('uv-meter-top', beforeFirstVerse);
      meterEl.style.display = 'block';
      row.classList.toggle('uv-meter-focus-top', beforeFirstVerse);
      uvMeterRowIdx = targetIdx;
      uvUpdatePlayStateIcon();
    }

    function uvUpdatePlayStateIcon() {
      if (uvMeterRowIdx === null || !uvRowEls[uvMeterRowIdx]) return;

    // IndexedDB helpers
    function openAudioDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('ivritAudioCache', 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore('audioFiles');
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e.target.error);
      });
    }
    async function saveAudioToDb(file) {
      const db = await openAudioDb();
      const key = `${file.name}_${file.size}`;
      return new Promise((resolve, reject) => {
        const tx = db.transaction('audioFiles', 'readwrite');
        tx.objectStore('audioFiles').put(file, key);
        tx.oncomplete = () => resolve(key);
        tx.onerror = e => reject(e.target.error);
      });
    }
    async function loadAudioFromDb(key) {
      const db = await openAudioDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('audioFiles', 'readonly');
        const req = tx.objectStore('audioFiles').get(key);
        req.onsuccess = e => resolve(e.target.result || null);
        req.onerror = e => reject(e.target.error);
      });
    }
    async function deleteAudioFromDb(key) {
      const db = await openAudioDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('audioFiles', 'readwrite');
        tx.objectStore('audioFiles').delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = e => reject(e.target.error);
      });
    }

    // Recent audio list
    const MAX_RECENT_AUDIO = 10;
    function getRecentAudioList() {
      return JSON.parse(localStorage.getItem('recentAudioList') || '[]');
    }
    function updateRecentAudioList(file) {
      const key = `${file.name}_${file.size}`;
      let list = getRecentAudioList().filter(i => i.key !== key);
      list.unshift({ key, name: file.name, size: file.size, ts: Date.now() });
      if (list.length > MAX_RECENT_AUDIO) list = list.slice(0, MAX_RECENT_AUDIO);
      localStorage.setItem('recentAudioList', JSON.stringify(list));
      localStorage.setItem('lastAudioKey', key);
      renderRecentAudioList();
    }
    function renderRecentAudioList() {
      const list = getRecentAudioList();
      const section = document.getElementById('recentAudioSection');
      const container = document.getElementById('recentAudioList');
      if (!list.length) { section.style.display = 'none'; return; }
      section.style.display = 'block';
      const activeKey = selectedAudioFile ? `${selectedAudioFile.name}_${selectedAudioFile.size}` : '';
      container.innerHTML = list.map(item =>
        `<div class="recent-audio-item${item.key === activeKey ? ' active' : ''}">
          <span class="recent-audio-name" onclick="loadRecentAudio('${item.key}')">${escHtml(item.name)}</span>
          <span style="display:flex;align-items:center;gap:0.4rem;">

          </span>
        </div>`
      ).join('');

    async function loadRecentAudio(key) {
      const file = await loadAudioFromDb(key);
      if (!file) {
        const list = getRecentAudioList().filter(i => i.key !== key);
        localStorage.setItem('recentAudioList', JSON.stringify(list));
        renderRecentAudioList();
        return;
      }
      localStorage.setItem('lastAudioKey', key);
      applyAudioFile(file);
    }
    async function removeRecentAudio(key) {
      await deleteAudioFromDb(key);
      const list = getRecentAudioList().filter(i => i.key !== key);
      localStorage.setItem('recentAudioList', JSON.stringify(list));
      if (localStorage.getItem('lastAudioKey') === key) localStorage.removeItem('lastAudioKey');
      renderRecentAudioList();
    }

    function numToHebrew(n) {
      if (n === 15) return 'טו';
      if (n === 16) return 'טז';
      const vals = [[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
      let result = '';
      for (const [val, ch] of vals) { while (n >= val) { result += ch; n -= val; } }
      return result;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function sefariaVerseUrl(book, chapterNum, verseNum) {
      if (!book || chapterNum == null || verseNum == null) return null;
      return `https://www.sefaria.org/${book.trim().replace(/\s+/g, '_')}.${chapterNum}.${verseNum}`;
    }

    function srtTimeToMs(t) {
      const [h, m, s] = t.split(':').map(Number);
      return (h * 3600 + m * 60 + s) * 1000;
    }

    function msToSrtTime(ms) {
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const ms2 = ms % 1000;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ms2).padStart(3,'0')}`;
    }

    function lastSrtEndTime() {
      const srt = lastData.srt || '';
      const matches = [...srt.matchAll(/\d{2}:\d{2}:\d{2},\d{3} --> (\d{2}:\d{2}:\d{2},\d{3})/g)];
      if (!matches.length) return null;
      const last = matches[matches.length - 1][1];
      const [t, ms] = last.split(',');
      return srtTimeToMs(t) + parseInt(ms);
    }

    function generateVerseSrt(verses) {
      const detected = verses.filter(v => !v.missing && v.startTime);
      if (!detected.length) return '';
      const lastEnd = lastSrtEndTime();
      return detected.map((v, i) => {
        const start = msToSrtTime(srtTimeToMs(v.startTime));
        const end = i < detected.length - 1
          ? msToSrtTime(srtTimeToMs(detected[i + 1].startTime))
          : lastEnd !== null ? msToSrtTime(lastEnd) : msToSrtTime(srtTimeToMs(v.startTime) + 30000);
        return `${i + 1}\n${start} --> ${end}\n${v.verseText || v.verse}`;
      }).join('\n\n');
    }

    function downloadVerseSrt() {
      const srt = generateVerseSrt(lastVersesData);
      if (!srt) return;
      const blob = new Blob([srt], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'verses.srt';
      a.click();
    }

    function generateTopicsSrt(topics) {
      const withTime = topics.filter(t => t.startTime);
      if (!withTime.length) return '';
      const lastEnd = lastSrtEndTime();
      return withTime.map((t, i) => {
        const start = msToSrtTime(srtTimeToMs(t.startTime));
        const end = i < withTime.length - 1
          ? msToSrtTime(srtTimeToMs(withTime[i + 1].startTime))
          : lastEnd !== null ? msToSrtTime(lastEnd) : msToSrtTime(srtTimeToMs(t.startTime) + 300000);
        return `${i + 1}\n${start} --> ${end}\n${t.title}`;
      }).join('\n\n');
    }

    function downloadTopicsSrt() {
      const srt = generateTopicsSrt(lastTopicsData);
      if (!srt) return;
      const blob = new Blob([srt], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'topics.srt';
      a.click();
    }

    function renderVerses(data, container) {
      if (data.error) {
        container.textContent = 'שגיאה: ' + data.error;
        container.style.display = 'block';
        return;
      }
      const { verses = [], complete } = data;
      lastVersesData = verses;
      if (selectedAudioFile && verses.length) {
        const key = `verseMapping_${selectedAudioFile.name}_${selectedAudioFile.size}`;
        localStorage.setItem(key, JSON.stringify(verses));
        if (data.topics?.length) {
          localStorage.setItem(`topicsMapping_${selectedAudioFile.name}_${selectedAudioFile.size}`, JSON.stringify(data.topics));
        }
        updateCacheButtons();
      }
      const detected = verses.filter(v => !v.missing);
      const first = detected[0]?.verse ?? '';
      const last = detected[detected.length - 1]?.verse ?? '';
      const range = first === last ? first : `${first} — ${last}`;
      let html = `<div class="verse-status">${complete ? '✅ הרצף שלם' : '⚠️ יש חורים ברצף'}</div>`;
      if (range) html += `<div style="text-align:right;margin-bottom:0.75rem;font-size:0.9rem;color:#555;">טווח: <strong>${escHtml(range)}</strong></div>`;
      const topicsWithTime = (data.topics || []).filter(t => t.startTime);
      if (data.topics?.length) {
        const hasTopicTimes = topicsWithTime.length > 0;
        html += `<div class="topics-toc">`;
        html += `<div class="topics-toc-title">📋 תוכן עניינים</div>`;
        for (let i = 0; i < data.topics.length; i++) {
          const t = data.topics[i];
          const sec = t.startTime ? srtTimeSec(t.startTime + ',000') : null;
          html += `<div class="topic-item"${sec !== null ? ` data-start="${sec}"` : ''}>`;
          html += `<span class="topic-item-title"><span style="color:#86efac;margin-left:0.4rem;">${i + 1}.</span>${escHtml(t.title)}</span>`;
          if (t.startTime) html += `<span class="topic-item-time">${escHtml(t.startTime)}</span>`;
          html += `</div>`;
        }
        if (hasTopicTimes) {
          html += `<div style="margin-top:0.5rem;text-align:left;"><button class="btn-download" style="background:#166534;" onclick="downloadTopicsSrt()">הורד SRT נושאים</button></div>`;
        }
        html += `</div>`;
      }
      if (detected.some(v => v.startTime)) {
        html += `<div style="text-align:left;margin-bottom:0.75rem;"><button class="btn-download" onclick="downloadVerseSrt()">הורד SRT פסוקים</button></div>`;
      }
      let verseIndex = 0;
      for (const v of verses) {

          html += `<div class="verse-missing">⚠️ חסר: ${escHtml(v.verse)}${v.verseText ? ` &mdash; <em>${escHtml(v.verseText)}</em>` : ''}</div>`;

            <div class="verse-header">
              <span class="verse-name"><span style="color:#aaa;font-weight:normal;margin-left:0.4rem;">${verseIndex}.</span>${escHtml(v.verse)}</span>
              <span style="display:flex;gap:0.5rem;align-items:center;">
                ${v.subtitleNum ? `<span class="verse-label" style="font-size:0.8rem;">#${escHtml(String(v.subtitleNum))}</span>` : ''}
                ${v.startTime ? `<span class="verse-time">${escHtml(v.startTime)}</span>` : ''}
              </span>
            </div>
            ${v.srtExcerpt ? `<div class="verse-srt"><span class="verse-label">SRT:</span> &ldquo;${escHtml(v.srtExcerpt)}&rdquo;</div>` : ''}
            ${v.verseText ? `<div class="verse-original"><span class="verse-label">פסוק:</span> ${escHtml(v.verseText)}</div>` : ''}
          </div>`;
        }
      }
      if (data.claudeRaw) {
        html += `<div style="margin-top:1rem;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;">
          <div style="background:#f1f5f9;padding:0.6rem 1rem;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block';this.querySelector('.dbg-arrow').textContent=this.nextElementSibling.style.display==='block'?'▲':'▼'">
            <span style="font-size:0.85rem;color:#888;">תשובת קלוד הגולמית</span>
            <span class="dbg-arrow" style="font-size:0.75rem;color:#888;">▼</span>
          </div>
          <div style="display:none;padding:1rem;background:#f8fafc;">
            <textarea style="width:100%;min-height:200px;font-size:0.8rem;font-family:monospace;direction:ltr;resize:vertical;border:none;background:transparent;outline:none;" readonly>${escHtml(JSON.stringify(JSON.parse(data.claudeRaw), null, 2))}</textarea>
          </div>
        </div>`;
      }
      container.innerHTML = html;
      container.style.display = 'block';
      container.querySelectorAll('.verse-card[data-start], .topic-item[data-start]').forEach(el => {
        el.style.cursor = 'pointer';
        el.addEventListener('click', () => {
          const audio = document.getElementById('srtPlayer');
          audio.currentTime = parseFloat(el.dataset.start);
          audio.play();
        });
      });
      if (data.topics?.length) lastTopicsData = data.topics;
    }

    function parseSrt(srtText) {
      return srtText.trim().split(/\n\s*\n/).map(block => {
        const lines = block.trim().split('\n');
        if (lines.length < 3) return null;
        const times = lines[1].split(' --> ');
        if (times.length < 2) return null;
        return {
          id: parseInt(lines[0]),
          start: srtTimeSec(times[0].trim()),
          end: srtTimeSec(times[1].trim()),
          text: lines.slice(2).join('\n'),
        };
      }).filter(s => s && !isNaN(s.start));
    }

    function srtTimeSec(t) {
      const [hms, ms] = t.split(',');
      const [h, m, s] = hms.split(':').map(Number);
      return h * 3600 + m * 60 + s + (parseInt(ms || 0) / 1000);
    }

    function fmtSec(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function setupAudioPlayer(fileOrUrl) {
      const audio = document.getElementById('srtPlayer');
      if (audio._blobUrl) URL.revokeObjectURL(audio._blobUrl);
      if (typeof fileOrUrl === 'string') {
        audio._blobUrl = null;
        audio.src = fileOrUrl;
      } else {
        audio._blobUrl = URL.createObjectURL(fileOrUrl);
        audio.src = audio._blobUrl;
      }
      document.getElementById('stickyPlayer').style.display = 'block';
      document.body.style.paddingTop = '60px';
      if (rawAudioMode || suppressCardHighlighting) return;
      audio.ontimeupdate = () => {
        const t = audio.currentTime;
        const verseCards = [...document.querySelectorAll('.verse-card[data-start]')];
        verseCards.forEach(c => c.classList.remove('active'));
        let activeVerse = null;
        for (const c of verseCards) {
          if (parseFloat(c.dataset.start) <= t) activeVerse = c;
        }
        if (activeVerse) {
          activeVerse.classList.add('active');
          activeVerse.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      };
    }

    function toggleUserView() {
      userViewActive = !userViewActive;
      document.querySelector('.card').style.display = userViewActive ? 'none' : '';
      document.getElementById('userView').style.display = userViewActive ? 'flex' : 'none';
      document.getElementById('stickyPlayer').style.display = userViewActive ? 'none' : 'block';
      document.getElementById('commentaryDrawer').classList.toggle('open', userViewActive && !commentaryDrawerClosed);
      document.getElementById('commentaryDrawer').classList.toggle('peek', userViewActive && commentaryDrawerClosed);
      const fab = document.getElementById('viewToggleFab');
      fab.textContent = userViewActive ? '🛠️' : '📖';
      fab.title = userViewActive ? 'חזרה לתצוגת ניפוי' : 'תצוגת משתמש';
      document.getElementById('captionToggleBtn').style.display = userViewActive ? 'none' : 'flex';
      if (isDebugRoute) document.getElementById('commitInfoBtn').style.display = userViewActive ? 'flex' : 'none';
      if (userViewActive) {
        if (!noRafLoops) renderUserView();
        updateUserViewPlayback();
        if (!noRafLoops) {
          if (showMeter) startUvMeterLoop();
          startUvPauseWatchLoop();
          startUvScrollLoop();
        }
      } else {
        stopUvMeterLoop();
        stopUvPauseWatchLoop();
        stopUvScrollLoop();
      }
    }

    function toggleCaptions() {
      captionsVisible = !captionsVisible;
      document.getElementById('userViewCaption').style.display = captionsVisible ? 'flex' : 'none';
      const btn = document.getElementById('captionToggleBtn');
      btn.classList.toggle('uv-off', !captionsVisible);
      btn.title = captionsVisible ? 'הסתר כתוביות' : 'הצג כתוביות';
    }

    let commitInfoCache = null;
    async function showCommitInfo() {
      document.getElementById('commitInfoOverlay').style.display = 'flex';
      if (!commitInfoCache) {
        try {
          commitInfoCache = await (await fetch('/debug/commit')).json();
        } catch (e) {
          commitInfoCache = { sha: null, message: null };
        }
      }
      const { sha, message } = commitInfoCache;
      document.getElementById('commitInfoBody').innerHTML = `
        <div class="commit-row"><b>קומיט:</b> ${sha ? escHtml(sha) : 'לא ידוע'}</div>
        <div class="commit-row"><b>הודעה:</b> ${message ? escHtml(message) : 'לא ידוע'}</div>`;
    }
    function hideCommitInfo() {
      document.getElementById('commitInfoOverlay').style.display = 'none';
    }

    function renderUserView() {
      uvVerses = lastVersesData
        .filter(v => !v.missing && v.verseText && v.startTime)
        .map(v => ({ text: v.verseText, sec: srtTimeSec(v.startTime + ',000'), verseNum: v.verseNum, chapterNum: v.chapterNum, book: v.book, sefariaUrl: sefariaVerseUrl(v.book, v.chapterNum, v.verseNum) }));
      uvCurrentIdx = null;
      uvPauseHandledIdx = null;
      uvMeterRowIdx = null;
      uvChapterBadgeIdx = null;
      const track = document.getElementById('uvTrack');
      const rowTag = linkerMode ? 'a' : 'div';
      track.innerHTML = uvVerses.map((v, i) => `
        <${rowTag} class="uv-row" data-idx="${i}"${linkerMode && v.sefariaUrl ? ` href="${escHtml(v.sefariaUrl)}" target="_blank" rel="noopener noreferrer"` : ''}>
          <span class="uv-num-badge">
            <span class="uv-chapter-num"></span>
            <span class="uv-verse-num">${v.verseNum != null ? numToHebrew(v.verseNum) : ''}</span>
          </span>
          <span class="uv-row-text">${escHtml(v.text)}</span>
          <span class="uv-row-spacer" aria-hidden="true"></span>
          <span class="uv-flash-icon" aria-hidden="true"></span>
          <span class="uv-play-state-icon" aria-hidden="true"></span>
          <div class="uv-meter"><div class="uv-meter-fill"></div><div class="uv-meter-handle"></div></div>
        </${rowTag}>`).join('');
      uvRowEls = [...track.querySelectorAll('.uv-row')];
      uvRowChapterEls = uvRowEls.map(el => el.querySelector('.uv-chapter-num'));
      uvMeasureRows();
      uvPositionTrack();
      if (sequenceMode) {
        uvCurrentChapterNum = null;
        uvUpdateStickyChapter(uvCurrentIdx);
      }
      // מגירת הפירוש מאותחלת כאן לפסוק הראשון, במצב פתוח/סגור שנשמר מה-session הקודם
      if (uvVerses.length) {
        updateCommentaryDrawerForVerse(uvVerses[0]);
        if (commentaryDrawerClosed) {
          document.getElementById('commentaryDrawer').classList.remove('open');
          document.getElementById('commentaryDrawer').classList.add('peek');
        }
      }
    }

    function uvUpdateStickyChapter(idx) {
      if (!sequenceMode) return;
      const chapIdx = idx === null ? 0 : Math.max(idx, 0);
      const v = uvVerses[chapIdx];
      const chapterNum = v && v.chapterNum != null ? v.chapterNum : null;
      // אם אין ערך תקין (למשל chapIdx רגעית מחוץ לתחום) - לא למחוק כותרת שכבר מוצגת, רק לדלג
      if (chapterNum == null || chapterNum === uvCurrentChapterNum) return;
      uvCurrentChapterNum = chapterNum;
      const bookHe = (v.book && BOOK_HE[v.book]) || v.book || '';
      document.getElementById('userViewTitle').textContent = `${bookHe} פרק ${numToHebrew(chapterNum)}`;
    }

    function uvMeasureRows() {
      uvRowCenters = uvRowEls.map(el => el.offsetTop + el.offsetHeight / 2);
    }

    const UV_ANCHOR_RATIO = 0.35; // חלק מגובה ה-viewport שבו "יושבת" השורה הפעילה (0.5 = מרכז מדויק)
    // הזזה קבועה למטה של כל אזור הפסוקים - הפסוק האחרון המוצג קרוב יותר למגירה, ולפסוק הראשון
    // נשאר רווח גדול יותר לפני הכותרת מעליו. נכנס לחישוב העוגן וגם לחישוב חלון התצוגה (uvComputeDynamicWindow)
    // כדי שגבולות הפסוקים המוצגים יתאימו למיקום הפיזי החדש.
    const UV_ROW_AREA_SHIFT_PX = 100;
    // רווח קבוע שנשמר בין סוף uvSeekBar לראש מגירת הפירוש (ראו שימוש ב-uvPositionTrack) - בלי זה
    // ה-drawerCoverPx הגולמי נצמד לפס בדיוק כשהמגירה במצב open לגמרי, בלי שום מרווח.
    const UV_SEEKBAR_DRAWER_GAP_PX = 10;
    // כמה מתחתית ה-viewport מכוסה כרגע ע"י מגירת הפירוש (px) - נמדד לפי המיקום האמיתי על המסך
    // (getBoundingClientRect, לא לפי class), כך שהעוגן זז בהדרגה גם באמצע אנימציית הפתיחה/סגירה
    function uvGetDrawerCoverPx(viewportRect) {
      const drawerRect = document.getElementById('commentaryDrawer').getBoundingClientRect();
      return Math.max(0, viewportRect.bottom - drawerRect.top);
    }
    function uvPositionTrack() {
      if (!uvRowCenters.length) return;
      const track = document.getElementById('uvTrack');
      const viewport = document.getElementById('userViewVerses');
      const idx = (uvCurrentIdx === null || uvCurrentIdx < 0) ? 0 : uvCurrentIdx;
      const rowCenter = uvRowCenters[idx] != null ? uvRowCenters[idx] : 0;
      let centerY = viewport.clientHeight * UV_ANCHOR_RATIO + UV_ROW_AREA_SHIFT_PX;
      if (sequenceMode) {
        // אין להשאיר רווח ריק מעל אם אין מספיק פסוקים קודמים למלא אותו (למשל בתחילת השיעור) -
        // העוגן מוגבל לגובה התוכן שבאמת קיים מעל, לא לגובה קבוע
        const win = uvComputeDynamicWindow(idx);
        const topRow = uvRowEls[win.minVisibleIdx];
        if (topRow) centerY = Math.min(centerY, rowCenter - topRow.offsetTop);
      }
      track.style.transform = `translateY(${centerY - rowCenter}px)`;

      // הזזה נוספת בגלל מגירת הפירוש - על עטיפה נפרדת (#uvDrawerShift) בלי transition CSS משלה,
      // כי היא מתעדכנת כל פריים ישירות לפי המיקום האמיתי (getBoundingClientRect) של המגירה המונפשת.
      // אם הייתה מוגדרת פה גם transition, ה-translateY של uvTrack (שיש לו transition לצעדי פסוקים)
      // היה "רודף" אחרי יעד שכל הזמן זז במהלך אנימציית הפתיחה/סגירה - נראה כפיגור, לא כתזוזה יחד.
      const drawerCoverPx = uvGetDrawerCoverPx(viewport.getBoundingClientRect());
      const drawerShiftPx = -drawerCoverPx * UV_ANCHOR_RATIO;
      document.getElementById('uvDrawerShift').style.transform = `translateY(${drawerShiftPx}px)`;
      // כפתור ה-play/pause הגדול הוא אח של uvDrawerShift (לא בתוכו, כי uvTrack עובר בו innerHTML
      // מלא) - מקבל את אותה הזזה ידנית כדי לעלות יחד עם הפסוקים כשהמגירה נפתחת
      document.getElementById('uvBigPlayBtn').style.transform = `translateX(-50%) translateY(${drawerShiftPx}px)`;

      // פס הגרירה (uvSeekBar) נמתח כברירת מחדל לכל גובה #userViewMiddle - מודדים ישירות מול המיקום
      // האמיתי של ראש המגירה (getBoundingClientRect, לא drawerCoverPx שמחושב יחסית ל-margin-bottom
      // של #userViewMiddle) כדי שהרווח הקבוע (UV_SEEKBAR_DRAWER_GAP_PX) יישמר זהה במצב peek, במצב
      // open ובכל רגע באמצע האנימציה ביניהם - לא רק כשהמגירה כבר חופפת בפועל את ה-margin.
      // (uvSeekBarFractionFromEvent/uvSeekBarRender ממילא עובדים לפי הגובה בפועל של הפס, אז הטווח
      // 0%-100% ממשיך למפות נכון לכל האודיו גם כשהגובה מצטמצם).
      const seekBarTop = viewport.getBoundingClientRect().top;
      const drawerTop = document.getElementById('commentaryDrawer').getBoundingClientRect().top;
      const seekBarHeightPx = Math.max(0, drawerTop - UV_SEEKBAR_DRAWER_GAP_PX - seekBarTop);
      document.getElementById('uvSeekBar').style.height = `${seekBarHeightPx}px`;
    }

    let uvScrollRaf = null;
    function uvScrollTick() {
      uvMeasureRows();
      uvPositionTrack();
      uvScrollRaf = requestAnimationFrame(uvScrollTick);
    }
    function startUvScrollLoop() {
      if (uvScrollRaf !== null) return;
      uvScrollRaf = requestAnimationFrame(uvScrollTick);
    }
    function stopUvScrollLoop() {
      if (uvScrollRaf !== null) { cancelAnimationFrame(uvScrollRaf); uvScrollRaf = null; }
    }

    function uvSetChapterBadge(i, show) {
      const el = uvRowChapterEls[i];
      const v = uvVerses[i];
      if (!el) return;
      el.textContent = (show && v && v.chapterNum != null) ? numToHebrew(v.chapterNum) : '';
    }

    function uvApplyVisibleWindow(idx) {
      uvRowEls.forEach(el => el.classList.remove('uv-active'));
      const activeEl = idx !== null ? uvRowEls[idx] : undefined;
      if (activeEl) activeEl.classList.add('uv-active');

      const badgeIdx = (idx === null || sequenceMode) ? null : Math.max(idx, 0);
      if (uvChapterBadgeIdx !== badgeIdx) {
        if (uvChapterBadgeIdx !== null) uvSetChapterBadge(uvChapterBadgeIdx, false);
        if (badgeIdx !== null) uvSetChapterBadge(badgeIdx, true);
        uvChapterBadgeIdx = badgeIdx;
      }

      let minVisibleIdx, maxVisibleIdx;
      if (sequenceMode) {
        const win = uvComputeDynamicWindow(idx !== null ? idx : 0);
        minVisibleIdx = win.minVisibleIdx;
        maxVisibleIdx = win.maxVisibleIdx;
      } else {
        minVisibleIdx = (idx !== null ? idx : 0) - prevVersesCount;
        maxVisibleIdx = (idx !== null ? idx : 0) + 1;
      }
      uvRowEls.forEach((el, i) => {
        el.classList.toggle('uv-hidden-hist', i < minVisibleIdx || i > maxVisibleIdx);
      });
    }

    function uvComputeDynamicWindow(idx) {
      const viewport = document.getElementById('userViewVerses');
      const spaceAbove = viewport.clientHeight * UV_ANCHOR_RATIO + UV_ROW_AREA_SHIFT_PX;
      const spaceBelow = viewport.clientHeight - spaceAbove;
      let before = 0, usedAbove = 0;
      for (let i = idx - 1; i >= 0; i--) {
        const h = uvRowEls[i] ? uvRowEls[i].offsetHeight : 0;
        if (usedAbove + h > spaceAbove) break;
        usedAbove += h;
        before++;
      }
      // כשאין מספיק פסוקים קודמים למלא את spaceAbove (למשל בתחילת השיעור), הרווח שנשאר פנוי
      // עובר ל"אחרי" - כדי שהתוכן ימלא את כל העמוד מההתחלה, לא רק לאחר שמצטברים מספיק פסוקים קודמים
      const spaceBelowEffective = spaceBelow + (spaceAbove - usedAbove);
      let after = 0, usedBelow = 0;
      for (let i = idx + 1; i < uvRowEls.length; i++) {
        const h = uvRowEls[i] ? uvRowEls[i].offsetHeight : 0;
        if (usedBelow + h > spaceBelowEffective) break;
        usedBelow += h;
        after++;
      }
      return { minVisibleIdx: idx - before, maxVisibleIdx: idx + after };
    }

    function renderUvActive() {
      uvApplyVisibleWindow(uvCurrentIdx);
      applyMeterVisibility();
    }

    let uvMeterRaf = null;
    function updateUvMeter() {
      const audio = document.getElementById('srtPlayer');
      // אין פסוק "נוכחי" לפני שהגיעו לפסוק הראשון (uvCurrentIdx === -1) - מודדים מתחילת ההשמעה עד הפסוק הראשון
      const cur = (uvCurrentIdx !== null && uvCurrentIdx >= 0) ? uvVerses[uvCurrentIdx] : null;
      const startSec = cur ? cur.sec : 0;
      const next = cur ? uvVerses[uvCurrentIdx + 1] : uvVerses[0];
      const endSec = next ? next.sec : (isFinite(audio.duration) ? audio.duration : null);
      const progress = (endSec === null || endSec <= startSec) ? 0
        : Math.min(1, Math.max(0, (audio.currentTime - startSec) / (endSec - startSec)));
      if (uvMeterRowIdx !== null && uvRowEls[uvMeterRowIdx]) {
        const fill = uvRowEls[uvMeterRowIdx].querySelector('.uv-meter-fill');
        if (fill) fill.style.transform = `scaleX(${progress})`;
        const handle = uvRowEls[uvMeterRowIdx].querySelector('.uv-meter-handle');
        if (handle) handle.style.left = `${(1 - progress) * 100}%`;
      }
    }
    function startUvMeterLoop() {
      if (uvMeterRaf !== null) return;
      const tick = () => { updateUvMeter(); uvMeterRaf = requestAnimationFrame(tick); };
      uvMeterRaf = requestAnimationFrame(tick);
    }
    function stopUvMeterLoop() {
      if (uvMeterRaf !== null) { cancelAnimationFrame(uvMeterRaf); uvMeterRaf = null; }
      if (uvMeterRowIdx !== null && uvRowEls[uvMeterRowIdx]) {
        const fill = uvRowEls[uvMeterRowIdx].querySelector('.uv-meter-fill');
        if (fill) fill.style.transform = 'scaleX(0)';
        const handle = uvRowEls[uvMeterRowIdx].querySelector('.uv-meter-handle');
        if (handle) handle.style.left = '100%';
      }
    }

    // גרירה/לחיצה על המד הקטן בתוך השורה הפעילה - מזיזה את הניגון בתוך גבולות הפסוק הנוכחי בלבד
    // (בניגוד לפס הגרירה האנכי, לא קופצת לפסוק אחר). .uv-meter-fill מתמלא מימין לשמאל
    // (transform-origin: right ב-CSS) לכן זמן 0 בפסוק הוא הקצה הימני של האלמנט, לא השמאלי.
    let uvMeterDragging = false;
    function uvMeterFractionFromEvent(e, meterEl) {
      const rect = meterEl.getBoundingClientRect();
      return Math.min(1, Math.max(0, (rect.right - e.clientX) / rect.width));
    }
    function uvMeterApplyDrag(e, meterEl) {
      const audio = document.getElementById('srtPlayer');
      const cur = (uvCurrentIdx !== null && uvCurrentIdx >= 0) ? uvVerses[uvCurrentIdx] : null;
      const startSec = cur ? cur.sec : 0;
      const next = cur ? uvVerses[uvCurrentIdx + 1] : uvVerses[0];
      const endSec = next ? next.sec : (isFinite(audio.duration) ? audio.duration : null);
      if (endSec === null || endSec <= startSec) return;
      audio.currentTime = startSec + uvMeterFractionFromEvent(e, meterEl) * (endSec - startSec);
    }
    // pointer capture (setPointerCapture) מרטרגט מחדש רק אירועי Pointer Events (move/up/cancel) לאלמנט
    // שנתפס - הוא לא חל על 'click' הישן, שממשיך להתבסס על hit-test רגיל במיקום ה-mouseup בפועל.
    // כשגוררים מחוץ לתחום הקטן של המד, ה-mouseup/click נופל על שורה אחרת לגמרי, וה-click handler
    // הרגיל של השורה (למטה) היה רואה אותו כלחיצה על פסוק אחר וקופץ אליו - נראה כאילו הגרירה "נתקעת"
    // או קופצת. הדגל הזה מסמן שה-click הבא שייך לגרירה שהסתיימה זה עתה ומדלג עליו לגמרי, בלי קשר ליעד.
    let uvMeterJustDragged = false;
    const uvTrackEl = document.getElementById('uvTrack');
    uvTrackEl.addEventListener('pointerdown', (e) => {
      const meterEl = e.target.closest('.uv-meter');
      if (!meterEl) return;
      e.stopPropagation(); // לא גם toggle play/pause של השורה - ראו בדיקת .uv-meter במאזין ה-click למטה
      uvMeterDragging = true;
      meterEl.setPointerCapture(e.pointerId);
      uvMeterApplyDrag(e, meterEl);
    });
    uvTrackEl.addEventListener('pointermove', (e) => {
      if (!uvMeterDragging) return;
      const meterEl = e.target.closest('.uv-meter');
      if (!meterEl) return;
      uvMeterApplyDrag(e, meterEl);
    });
    ['pointerup', 'pointercancel'].forEach(evt => uvTrackEl.addEventListener(evt, () => {
      if (!uvMeterDragging) return;
      uvMeterDragging = false;
      uvMeterJustDragged = true;
      // במגע (טאץ') גרירה אמיתית (תזוזה משמעותית) לא מייצרת בכלל 'click' סינתטי בסיום המחווה -
      // הדגל היה נשאר true עד הלחיצה האמיתית הבאה של המשתמש ו"בולע" אותה בלי סיבה. טיימאאוט קצר
      // מאפס אותו בעצמו אם לא הגיע click "הד" מיידי (עכבר כן מייצר click גם אחרי גרירה - זה נבלע כרגיל).
      setTimeout(() => { uvMeterJustDragged = false; }, 350);
      updateUserViewPlayback(); // סנכרון אחד-פעמי בסיום הגרירה - ראו למה מדולג תוך כדי גרירה בהערה שם
    }));
    // מונע מהמחוות לבעבע ל-listeners של swipe-ניווט/wheel שמאזינים על #userView כולו

    // אוטומטית ע"י הדפדפן כשהעמוד עובר לרקע (טאב אחר/מסך ננעל) - צריך לבקש אותו מחדש

    }

    // פס גרירה אנכי מימין לפסוקים - מיפוי ישיר וקבוע של מיקום ב-Y לאחוז מתוך משך האודיו
    // (בלי תלות במדידת גובה שורות/קאש, בניגוד ל"גרירה חיה" של הקרוסלה שנוסתה ונדחתה בעבר).

    // זמן 0 (לפני הפסוק הראשון, idx=-1) מתחרה כאופציה לגיטימית משלו - אחרת אי אפשר לגרור חזרה לשם.

    // ראו startCommentaryDrawerDrag) נוחתת לעתים קרובות (הפס צמוד לקצה, אצבעות/אגודל נחים שם). לכן
    // רק נגיעה קרובה בפועל לפס המרכזי נחשבת "גרירת seek" - נגיעה רחוקה יותר בתוך אותו רוחב "נופלת"

    // בקשות נוספות. שומרים גם את ה-Promise (למניעת בקשות כפולות בזמן טעינה) וגם את הערך שנפתר
    // (לרינדור סינכרוני מיידי כשהמידע כבר קיים - בלי הבהוב "טוען..." בין פסוקים).
    const commentaryChapterCache = new Map(); // key: book|chapter|commentator -> Promise<{verseNum: text|null}>

    // עם ערך זרוע מראש לברירת המחדל, כדי שהכפתור לא יראה "Rashi" באנגלית לפני שהרשימה נפתחה ולו פעם אחת

    // שהמשתמש יכול לנווט אליו בתוך השיעור

    function fetchCommentatorsChapter(v) {

      if (commentatorsChapterCache.has(key)) return commentatorsChapterCache.get(key);
      const { minVerse, maxVerse } = chapterVerseRange(v);
      const promise = fetch(`/sefaria/commentators?book=${encodeURIComponent(v.book)}&chapter=${v.chapterNum}&minVerse=${minVerse}&maxVerse=${maxVerse}`)

    function truncatePreview(text) {
      return text.length > 50 ? text.slice(0, 50) + '…' : text;
    }

    function renderCommentaryDrawer() {
      const v = commentaryDrawerVerse;
      if (!v) return;
      const refEl = document.getElementById('commentaryDrawerRef');
      const bodyEl = document.getElementById('commentaryDrawerBody');
